    <div class="question">${q.question}</div>
    <div class="choices">
      ${q.choices.map((c, i) => `
        <button class="choice" data-i="${i}">
          <span class="letter">${letters[i]}</span>
          <span>${c}</span>
        </button>
      `).join('')}
    </div>
    <div id="resultSlot"></div>
    <div class="nav-row"><button class="next-btn" id="nextBtn">${idx === QUESTIONS.length - 1 ? 'See results' : 'Next question →'}</button></div>
  `;

  const buttons = questionCard.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => onAnswer(parseInt(btn.dataset.i, 10)));
  });
}

function onAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[idx];
  const correct = chosen === q.answer;
  if (correct) score++;

  const buttons = questionCard.querySelectorAll('.choice');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const resultSlot = document.getElementById('resultSlot');
  resultSlot.innerHTML = `
    <div class="result-banner ${correct ? 'good' : 'bad'}">${correct ? '✓ Correct!' : '✗ Not quite.'}</div>
    <div class="explanation">${q.explanation}</div>
  `;

  scoreLive.textContent = 'Score so far: ' + score;
  document.getElementById('nextBtn').classList.add('show');
}

document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'nextBtn') {
    idx++;
    if (idx >= QUESTIONS.length) {
      showFinal();
    } else {
      render();
    }
  }
});

function showFinal() {
  progressFill.style.width = '100%';
  progressLabel.textContent = 'Done!';
  quizArea.classList.add('hidden');
  finalArea.classList.remove('hidden');

  let line;
  if (score === QUESTIONS.length) line = "Perfect score! You're reading this codebase like a pro.";
  else if (score >= 8) line = "Excellent work — you've got a really solid handle on this.";
  else if (score >= 6) line = "Good run — the architecture is clearly starting to click.";
  else if (score >= 4) line = "Solid effort — a few of these ideas are worth a second look.";
  else line = "Everyone starts somewhere — the whole point of the daily quiz is to build this up slowly.";

  finalArea.innerHTML = `
    <div class="topic-tag">Quiz #27 complete</div>
    <div class="big-score">${score} / ${QUESTIONS.length}</div>
    <div class="line">Ascent Quiz — 2026-09-08</div>
    <div class="encourage">${line}</div>
    <button class="restart-btn" id="restartBtn">Take it again</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    idx = 0; score = 0;
    quizArea.classList.remove('hidden');
    finalArea.classList.add('hidden');
    render();
  });
}

render();
</script>
</body>
</html>
