name: desktop-release

# Builds the Windows NSIS installer (ASCENT-Setup.exe) in CI with electron-builder. electron-builder is NEVER a
# repo dependency (Windows Defender quarantines its app-builder.exe on the dev PC); it is installed --no-save here.
# publish=false (default) only uploads a workflow artifact. A pull_request run (paths-filtered) exercises the same
# build + smoke with a throwaway version so the workflow is testable before it lands on main.
on:
  workflow_dispatch:
    inputs:
      sha: { description: 'Commit to build', required: true, type: string }
      version: { description: 'Release version (no leading v)', required: true, type: string }
      versusUrl: { description: 'Versus Worker URL baked into the build', required: true, type: string }
      hubUrl: { description: 'Friends hub URL baked into the build', required: true, type: string }
      contentRevision: { description: 'Versus Worker content revision', required: true, type: string }
      publish: { description: 'Publish to a draft GitHub release', required: false, type: boolean, default: false }
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/bundle-shell.mjs'
      - 'scripts/package-desktop.mjs'
      - '.github/workflows/desktop-release.yml'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BUILD_SHA: ${{ inputs.sha || github.sha }}
      BUILD_VERSION: ${{ inputs.version || format('0.0.0-pr.{0}', github.run_number) }}
      VERSUS_URL: ${{ inputs.versusUrl }}
      HUB_URL: ${{ inputs.hubUrl }}
      CONTENT_REVISION: ${{ inputs.contentRevision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stamp the version
        shell: bash
        run: |
          npm pkg set version="$BUILD_VERSION"
          npm pkg set version="$BUILD_VERSION" --prefix apps/desktop
      - name: Build the web bundle
        shell: bash
        env:
          VITE_VERSUS_CF_URL: ${{ inputs.versusUrl }}
          VITE_FRIENDS_HUB_URL: ${{ inputs.hubUrl }}
        run: npm run build:web
      - name: Write release.json
        shell: bash
        run: |
          node -e "
          const e = process.env;
          require('fs').writeFileSync('apps/web/dist/release.json', JSON.stringify({
            sha: e.BUILD_SHA.slice(0, 8),
            contentRevision: e.CONTENT_REVISION || null,
            versusWorker: e.VERSUS_URL || null,
            hub: e.HUB_URL || null,
            builtAt: new Date().toISOString(),
          }) + '\n');
          "
      - run: node scripts/bundle-shell.mjs
      - name: Build the installer
        shell: bash
        run: |
          npm i --no-save --no-audit --no-fund electron-builder@26.18.1
          # electron-builder cannot resolve the workspace's ^range, so hand it the installed version.
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          npx electron-builder --win nsis --publish never --projectDir apps/desktop -c.electronVersion="$ELECTRON_VERSION"
      - name: Check the self-update config
        shell: bash
        # updater.cjs only runs when resources/app-update.yml exists (the zip exe has none), and reads its feed from it.
        run: |
          f=apps/desktop/release-ci/win-unpacked/resources/app-update.yml
          test -f "$f" || { echo "missing $f — the installed app would never self-update"; exit 1; }
          cat "$f"
          grep -q '^provider: generic' "$f" || { echo "app-update.yml is not the generic provider"; exit 1; }
          grep -qF 'url: https://github.com/kcodea/ascent/releases/latest/download' "$f" || { echo "app-update.yml does not name the latest/download feed"; exit 1; }
          for x in updating.html updatingPreload.cjs updating-logo.png; do
            test -f "apps/desktop/build/$x" || { echo "shell bundle is missing $x"; exit 1; }
          done
      - name: Smoke-test the unpacked app
        shell: bash
        run: |
          rm -f smoke.json
          if [ "${{ github.event_name }}" = pull_request ]; then export ASCENT_SMOKE_OFFLINE=1; fi
          ASCENT_SMOKE=1 ASCENT_SMOKE_OUT="$PWD/smoke.json" apps/desktop/release-ci/win-unpacked/ASCENT.exe || true
          test -f smoke.json || { echo "smoke produced no report"; exit 1; }
          cat smoke.json
          node -e "process.exit(JSON.parse(require('fs').readFileSync('smoke.json','utf8')).ok === true ? 0 : 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: ascent-installer-${{ env.BUILD_VERSION }}
          if-no-files-found: error
          path: |
            apps/desktop/release-ci/ASCENT-Setup.exe
            apps/desktop/release-ci/ASCENT-Setup.exe.blockmap
            apps/desktop/release-ci/latest.yml
            apps/web/dist/release.json
            smoke.json

  # publish=true (dispatched by `npm run ship`): create the DRAFT release v<version> on the built commit. ship.mjs fills the
  # notes and publishes the draft only after this run is green; a red run leaves the draft invisible to friends.
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_SHA: ${{ inputs.sha }}
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascent-installer-${{ inputs.version }}
          path: out
      - name: Create the draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$BUILD_VERSION"
          # A retry after a red run: replace the stale DRAFT (never a published release).
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)" = true ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$BUILD_SHA" --title "ASCENT v$BUILD_VERSION" \
            --notes "ASCENT v$BUILD_VERSION" \
            out/apps/desktop/release-ci/ASCENT-Setup.exe \
            out/apps/desktop/release-ci/ASCENT-Setup.exe.blockmap \
            out/apps/desktop/release-ci/latest.yml \
            out/apps/web/dist/release.json
