name: CI

# The gate that keeps `main` always-playable for two-dev work: every PR must typecheck, lint,
# build, and pass tests before it can merge. The build step is the closest proxy for "the game
# compiles + boots". See CLAUDE.md → Collaboration for the full flow.
on:
  pull_request:
    branches: [main]
    # `labeled` so adding the `ci:heavy` label re-runs CI with the heavy shards (see test-heavy below).
    types: [opened, synchronize, reopened, labeled]
  # Every push to main runs EVERYTHING, heavy shards included: a heavy regression that slipped past a PR fails
  # the main run visibly.
  push:
    branches: [main]
  # Nightly full run (heavy shards included) on main, even on a quiet day.
  schedule:
    - cron: '31 7 * * *'
  # Manual full run on any branch (Actions tab -> CI -> Run workflow).
  workflow_dispatch:

# A new push to a PR cancels that PR's stale run (it can no longer merge anyway). Runs on `main` are
# NEVER cancelled: each push to main gets its own group (keyed by SHA) and cancel-in-progress is off
# for non-PR events, so every commit that lands on main keeps a complete verdict. Adding an UNRELATED
# label to a PR gets a throwaway group (its run id) so it never cancels the PR's real run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:heavy') && github.ref || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that is not vitest, in one job that runs alongside the test shards (~2 min total).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The two halves of `npm run typecheck` (which is what CLAUDE.md tells a human to run), split into
      # separate steps so a red build names the layer that broke. Keep them in sync with package.json.
      - run: npm run typecheck:pkgs  # engine: core/content/sim/tools — the highest-value Claude-break catcher
      - run: npm run typecheck:web   # presentation: @game/ui + apps/web (vite build strips types, so this is the ONLY gate)
      - run: npm run lint        # eslint (incl. the Math.random ban in core/content/sim/tools)
      - run: npm run build:web   # vite build MUST succeed = the game compiles

  # vitest: determinism + golden + effect tests, split across parallel runners. vitest shards BY FILE, so the
  # floor is the slowest single file — the multi-minute balance self-play suites. So the groups are explicit
  # (see `testSelection` in vitest.config.ts): each HEAVY_GROUPS entry gets its own runner (`--mode heavy-<i>`)
  # and everything else is sharded evenly with `--mode light`. If you add/remove a heavy group, add/remove its
  # matrix entry here; if you change the light shard count, keep the `--shard=N/<total>` denominator in sync.
  # The strategist benchmark (~13 min) is NIGHTLY-ONLY — see nightly-slow-tests.yml / `npm run test:slow`.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one red shard must not hide the others' failures
      matrix:
        group:
          - { name: "light 1/3", args: "--mode light --shard=1/3" }
          - { name: "light 2/3", args: "--mode light --shard=2/3" }
          - { name: "light 3/3", args: "--mode light --shard=3/3" }
          # The heavy groups run in the separate `test-heavy` job below (not on PRs by default).
    name: test (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- ${{ matrix.group.args }}

  # The multi-minute balance self-play suites (~13-15 min). OFF on pull requests by default so PRs merge fast
  # and do not hog GitHub's concurrent-job cap; ON for push to main, the nightly schedule and manual
  # dispatch. A PR opts in with the `ci:heavy` label (adding it re-runs CI; it stays on for later pushes).
  test-heavy:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci:heavy')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: "heavy 0 (production bots)", args: "--mode heavy-0" }
          - { name: "heavy 1 (self-play lobby)", args: "--mode heavy-1" }
          - { name: "heavy 2 (scout + generalist)", args: "--mode heavy-2" }
          - { name: "heavy 3 (armor + lobby)", args: "--mode heavy-3" }
    name: test (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- ${{ matrix.group.args }}

  # THE REQUIRED CHECK. `main`'s org-level policy requires a status named exactly `verify` — do not rename
  # this job. It always runs (`if: always()`) and fails unless checks + every light shard SUCCEEDED, so a failed,
  # skipped or cancelled light shard can never read as green. The heavy shards may be `skipped` (their normal
  # state on a PR) but when they ran (main, nightly, dispatch, `ci:heavy`) anything other than success fails it.
  verify:
    if: always()
    needs: [checks, test, test-heavy]
    runs-on: ubuntu-latest
    steps:
      - name: All checks and test shards passed
        env:
          REQUIRED: ${{ needs.checks.result }} ${{ needs.test.result }}
          HEAVY: ${{ needs.test-heavy.result }}
        run: |
          echo "checks + light tests: $REQUIRED | heavy tests: $HEAVY"
          for r in $REQUIRED; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job finished as '$r'"
              exit 1
            fi
          done
          case "$HEAVY" in
            success|skipped) ;;
            *) echo "::error::the heavy test shards finished as '$HEAVY'"; exit 1 ;;
          esac
