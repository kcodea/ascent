# VERSUS on Cloudflare (2026-10-28). Local: `npm run versus:cf:dev` (wrangler dev on :8787, dev tokens accepted).
#
# DEPLOYS go through `npm run versus:cf:deploy` (scripts/deploy.ts), never a bare `wrangler deploy`: it names the Worker
# after the engine it carries (`ascent-versus-v<cfProtocol>-<contentRevision>`), so every content revision is its own
# Worker and its own Durable Object namespace. A new pack deploys a NEW Worker; rooms already playing on the old one
# finish there (owner ruling 2026-10-28: "in-flight matches finish on the old version"). Old versions are deleted once
# they have no live rooms. It also passes SUPABASE_ANON_KEY (the public publishable key) from apps/web/.env.
#
# SECRETS (never committed; set with scripts/writer-secret.mjs, which pipes them to `wrangler secret put`):
#   VERSUS_WRITER_SECRET   the result writer's key for `versus_cf_persist` (supabase/migrations/2026-11-04-versus-cf-writer.sql).
# No Supabase JWT secret is needed: project zcwhbejpqcdcfdpfxeza signs access tokens with an ES256 key (JWKS).
name = "ascent-versus"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The Supabase project (public URL): the JWKS that signs player access tokens, and the REST base for the result writer.
SUPABASE_URL = "https://zcwhbejpqcdcfdpfxeza.supabase.co"
# "1" accepts `dev.<userId>.<name>` bearer tokens (local only; `npm run versus:cf:dev` passes it). Never set in prod.
DEV_AUTH = "0"
# Result writes are OFF unless "1" (and VERSUS_WRITER_SECRET is set and the writer migration applied).
# Browser origins allowed to call the Worker (`*` = one host label or a port): the game's Netlify site (owner 2026-10-28)
# and local dev ports. CONFIG, not code: a deploy with VERSUS_ALLOWED_ORIGINS set in the environment uses that list
# instead (scripts/deploy.ts), so a custom domain is added without editing this file (docs/versus-cf-cutover.md).
ALLOWED_ORIGINS = "https://ascent-game-web.netlify.app,http://localhost:*,http://127.0.0.1:*"
PERSIST = "0"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "VersusRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "VersusDirectory"

[[durable_objects.bindings]]
# LIVE GAMES ON CLOUDFLARE (2026-10-29, R-LIVE-CF-01): one object per live lobby / Practice game.
name = "LIVE"
class_name = "VersusLiveGame"

[[services]]
# LIVE GAMES ON THE HUB (2026-10-30, R-LIVE-DIR-01): every room and live game registers its listing in the hub's ONE
# directory, so Live Games spans every content revision. A service binding to the stable `ascent-hub` Worker's named
# entrypoint: Worker to Worker, never reachable from the internet, no secret to hand out. The hub must be deployed FIRST
# (release:web deploys it before this Worker). Without it (a local `versus:cf:dev` with no `hub:dev`) the writes are
# skipped.
binding = "LIVE_DIR"
service = "ascent-hub"
entrypoint = "LiveDirectoryWriter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VersusRoom", "VersusDirectory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VersusLiveGame"]

[observability]
enabled = true
