      question: "packages/core/src/combat/side.ts defines a frozen, ~20-field <code>EMPTY_SIDE</code> (all zeros), then just this: <code>function combatSide(partial = {}) { return { ...EMPTY_SIDE, ...partial }; }</code>. A caller writes <code>combatSide({ tier: 6 })</code> and gets back a full, valid object with the other ~19 fields already filled in. What is this function actually doing?",

      answer: 2,
      explanation: "<code>combatSide()</code> is the classic \"fill in defaults\" pattern: spread the base object first, then the caller's overrides on top, so later keys win. `EMPTY_SIDE` is frozen and only ever read, never touched (side.ts) — so D is wrong, nothing is mutated. There's no validation (A) or lookup (C) happening; it's a plain object literal returned from a plain function — the reducer, the tools, and every test all use it so nobody has to spell out all ~20 fields by hand."
    },
    {

      question: "packages/sim/src/reducer.ts stamps the wave's opponent into <code>state.servedBoards[state.wave]</code> on the FIRST recruit action of a turn, rather than waiting until combat starts. The comment calls this a fix for a \"reload-divergence\" bug, saying the pick used to come from \"a session-variable pool.\" What went wrong before this fix, and how does pinning it early solve it?",
      choices: [

        "Before the fix, the opponent was drawn from a live, in-memory pool each time recruit code ran — so reloading the page mid-turn could re-roll a DIFFERENT board than the one already shown. Stamping the pick into `servedBoards` (part of persisted run state) the moment the turn starts means every reload reads back that same saved pick instead of re-rolling.",
        "It stops players from seeing which opponent they'll face before combat, to preserve suspense.",

      explanation: "The comment literally names this a \"reload-divergence fix\": before it, the enemy pick lived only in a transient, session-scoped pool, so re-rendering after a reload could draw a fresh (different) opponent than the one already shown. Stamping the pick into `state.servedBoards` — a field that's part of the persisted `RunState` — the moment the turn is first played means a reload reads back the exact same saved value instead of re-rolling. C and D describe real project concerns elsewhere in the codebase, but aren't what this specific fix addresses."
    },
    {
      topicId: "seeded-rng",
      topicLabel: "The seeded RNG",
      question: "rng.ts's `Rng` interface includes <code>state(): number</code>, with a comment: \"Persist this to resume the exact same stream later (`makeRng(rng.state())`) — lets a pure reducer thread RNG through plain, serializable state.\" Why would a REDUCER specifically need the RNG's state to be a plain number it can save and restore, instead of just holding onto the live `Rng` object?",
      choices: [

        "Because calling `state()` produces a completely different stream of random numbers than continuing to use the live object would.",
        "Because only one `Rng` object is allowed to exist per JavaScript process.",
        "A reducer must hand back fresh, serializable state on every dispatch (no live closures baked in) because that state gets saved, reloaded, and replayed — `state()` returns the RNG's mutable counter as one plain number, and `makeRng(that number)` rebuilds an RNG that resumes the exact same stream, so 'where the RNG is' can be persisted without persisting the RNG object itself."
      ],
      answer: 3,
      explanation: "A reducer must be able to hand back a plain, serializable `RunState` on every dispatch — no live closures baked into it — because that state gets saved, reloaded, and replayed. `state()` returns the RNG's whole mutable counter as one plain number, and `makeRng(that number)` rebuilds an RNG that continues the exact same stream, so a reducer can persist \"where the RNG is\" without persisting the RNG object itself. B and C invent behavior `state()` doesn't actually have."

      topicLabel: "Sim/UI decoupling",

      choices: [

      choices: [

        "Vite downloads `@game/content` from the public npm registry during `npm install`, ignoring the local folder entirely."

      choices: [
        "Yes — any function that reads or writes something declared outside itself is automatically impure, no exceptions.",
        "Not in the sense that matters to callers: `poolFor('set2')` still always returns the same result for the same input — from the outside, it's referentially transparent. The `resolved` Map is purely an internal caching detail (skip re-walking a set's inherit/exclude chain on repeat calls); it never lets the SAME input produce a DIFFERENT output.",

    {

      topicLabel: "Data vs. code",
      question: "packages/content/src/schema.ts declares <code>EffectDefSchema = z.object({ on: GameEventSchema, do: EffectFactoryIdSchema, params: z.record(z.unknown()).optional(), align: ... }).strict();</code> — every card effect in the game validates against this ONE shape: which event triggers it, which factory handles it, and what params it needs. What does `.strict()` buy here, and what does this shape show about how a new card ability usually gets added?",
      choices: [

    if (correct) score++;
    answered++;
    scoreLabel.textContent = "Score: " + score + " / " + answered + " answered";

    verdictText.textContent = correct ? "✓ Correct!" : "✗ Not quite — correct answer is " + letters[q.answer] + ".";
    verdictText.className = "verdict " + (correct ? "good" : "bad");
    explanationText.innerHTML = q.explanation;
    explanationArea.classList.add("show");
    nextBtn.classList.add("show");
    nextBtn.textContent = (current === QUESTIONS.length - 1) ? "See final score →" : "Next question →";
  }

  nextBtn.addEventListener("click", function () {
    current++;
    if (current >= QUESTIONS.length) {
      showSummary();
    } else {
      renderQuestion();
    }
  });

  function showSummary() {
    quizArea.classList.add("hidden");
    summaryArea.classList.remove("hidden");
    document.getElementById("summaryScore").textContent = score + " / " + QUESTIONS.length;
    var pct = Math.round((score / QUESTIONS.length) * 100);
    document.getElementById("summaryPct").textContent = pct + "%";
    var msg;
    if (score === QUESTIONS.length) {
      msg = "Perfect score! You're reading this codebase like it's your own — because it is. 🎉";
    } else if (score >= 8) {
      msg = "Great run — you clearly know your way around this engine. A couple of these were genuinely tricky.";
    } else if (score >= 6) {
      msg = "Solid! You're picking up the architecture steadily — reply with your score and which ones tripped you up, and tomorrow's quiz will circle back to them.";
    } else if (score >= 4) {
      msg = "Good effort — this is how learning a codebase actually feels. Tell me your score and we'll re-teach the tricky spots from a fresh angle.";
    } else {
      msg = "That's alright — these were dense ones today. Reply with your score and we'll slow down and revisit these topics soon.";
    }
    document.getElementById("summaryEncourage").textContent = msg;
  }

  renderQuestion();
})();
</script>
</body>
</html>
