<script>
(function () {
  var QUESTIONS = [
    {
      topicId: "what-is-a-function",
      topicLabel: "What a function is",
      question: "packages/core/src/rng.ts defines <code>int(maxExclusive)</code> as: <code>(maxExclusive) =&gt; (maxExclusive &lt;= 0 ? 0 : Math.floor(next() * maxExclusive))</code>. In plain terms — ignoring the ternary/Math.floor syntax for a moment — what KIND of thing is this?",
      choices: [
        "A function: something that takes input(s) (here, `maxExclusive`) and computes/returns an output (a whole number) each time it's called — and here, calling it twice with the same input can give different results, because it also reads from `next()`.",
        "A variable holding a fixed number, computed once when the file loads and never changing again.",
        "A type definition describing the shape of a number.",
        "A comment explaining what `int` should do, not code that actually runs."
      ],
      answer: 0,
      explanation: "The arrow syntax `(maxExclusive) => ...` is a function: it accepts an input and produces a value on demand, every time something calls it — that's the everyday shape you'll see constantly across Ascent's code, `name: (inputs) => computation`. It's not a fixed value (B — a plain variable wouldn't take an input at all), not a type (C — a type looks like `type Foo = number`, it never runs), and it IS executable code the engine actually calls, not documentation (D).",
    },
    {
      topicId: "deterministic-sim",
      topicLabel: "Deterministic simulation",
      question: "packages/core/src/presentation/collector.ts's doc comment says: \"Determinism is structural: ids come from a batch-local counter, so the same resolution always produces byte-identical events (no time/random).\" Why does using a plain counter (instead of something like `Date.now()` or a random id) matter for keeping combat deterministic?",
      choices: [
        "It's purely a speed optimization — a counter is faster to compute than reading the clock.",
        "Counters use less memory than timestamps, which matters for save-file size.",
        "A counter's value only depends on how many times it's been incremented THIS run — fully controlled by the deterministic simulation logic — so replaying the same combat produces the exact same sequence of ids every time. `Date.now()` or a random id would depend on the real-world clock or true randomness, breaking that guarantee.",
        "It doesn't really matter — ids are cosmetic and never compared between runs."
      ],
      answer: 2,
      explanation: "\"Deterministic\" means same inputs → same outputs, always. A batch-local counter's value is entirely a function of the simulation's own logic (how many times it counted up), so two runs of the identical combat produce identical ids. A timestamp or a true-random id would depend on something OUTSIDE the simulation — exactly the class of thing the seeded-RNG rule and the `Math.random` ban (see eslint-rules) exist to keep out of core/content/sim. (A), (B), and (D) miss the actual reason: reproducibility, not speed, memory, or cosmetics.",
    },
    {
      topicId: "seeded-rng",
      topicLabel: "The seeded RNG",
      question: "rng.ts's <code>fork()</code> is implemented as <code>fork: () =&gt; makeRng((next() * 4294967296) &gt;&gt;&gt; 0)</code> — notice it calls `next()`. What effect does calling `.fork()` have on the PARENT rng's own future `.next()` calls?",
      choices: [
        "None — `fork()` only reads the parent's current state, it doesn't consume from its sequence.",
        "Calling `fork()` advances the parent's internal sequence by one step (because it calls `next()` to seed the child), so the very next `.next()` call on the parent returns a different value than if `fork()` had never been called.",
        "`fork()` resets the parent back to its original seed.",
        "`fork()` pauses the parent rng until the child rng is discarded."
      ],
      answer: 1,
      explanation: "`fork()`'s body calls `next()` on the parent to generate the child's seed, and `next()` always advances the parent's internal counter `a` as a side effect — exactly like any other call to `.next()`. So the parent \"spends\" one step of its own sequence to create the child. This stays fully deterministic (same seed + same sequence of calls, forks included, still reproduces identically) — but it does mean fork order is part of what makes a replay reproducible. (A) is wrong because `next()` is never free of that side effect; (C) and (D) invent behavior the code doesn't have.",
    },
    {
      topicId: "sim-ui-decoupling",
      topicLabel: "Sim/UI decoupling",
      question: "packages/core/src/presentation/collector.ts ships a `NOOP_COLLECTOR` — \"a zero-allocation stand-in ... so instrumented mutation helpers cost nothing when nobody is watching\" — used by headless bots and balance sims. Why would the ENGINE need a version of itself that records no presentation events at all?",
      choices: [
        "Because the UI can't handle that many events at once and would crash.",
        "Because `NOOP_COLLECTOR` is leftover code from an old version that nobody has removed yet.",
        "Because bots and balance sims aren't allowed to use randomness.",
        "Because bots and balance sims (which run thousands of simulated games with nobody watching) don't need a UI to animate anything — building presentation data for no audience would be pure waste, so the SAME gameplay logic runs either way, just swapping in a do-nothing recorder instead of the real one."
      ],
      answer: 3,
      explanation: "This is the sim/UI split in action: the same gameplay logic that would normally hand presentation events off to a UI needs to run identically for balance sims and bots too — there's just nothing watching. Rather than branching the gameplay code itself, the engine swaps in a \"do-nothing\" collector so the exact same code path runs, minus the bookkeeping cost. (A) misreads it — headless runs have no UI involved at all; (B) is false, it's documented, deliberate design; (C) is unrelated.",
    },
    {
      topicId: "monorepo-packages",
      topicLabel: "Monorepo packages",
      question: "packages/core/src/index.ts is about a dozen lines, all <code>export * from './types'</code>, <code>export * from './rng'</code>, <code>export * from './combat/simulate'</code>, etc. — no logic. packages/ui then writes <code>import { simulate } from '@game/core'</code>, never <code>from '@game/core/src/combat/simulate'</code>. What's the point of routing every import through this one file?",
      choices: [
        "`index.ts` is the package's PUBLIC entrypoint: it defines exactly what's available outside `core`. Reaching straight into an internal file instead is what CLAUDE.md calls \"the boundary leaked\" — routing through `index.ts` means core's internals can be freely reorganized as long as it keeps re-exporting the same names.",
        "It's required by TypeScript — importing from a subfolder of another package is never technically possible.",
        "It makes the final bundled file smaller.",
        "It's purely a style preference with no functional effect either way."
      ],
      answer: 0,
      explanation: "The barrel file is the contract between `@game/core` and everything downstream. As long as `index.ts` keeps exporting `simulate`, the maintainer can move `simulate.ts` to a different folder or split it in two without breaking any consumer. Reaching past it with a deep import couples a consumer to internal file layout — the exact thing CLAUDE.md's \"ui depends on the others through public package entrypoints only\" rule is guarding against. (B) is false (deep imports are technically legal, just against convention); (C)/(D) aren't the real reason this pattern exists.",
    },
    {
      topicId: "pure-functions",
      topicLabel: "Pure functions",
      question: "packages/core/src/combat/minion.ts's <code>instantiate()</code> doc comment: \"Clone a board minion into a live combat instance. Pulls identity/effects from the (immutable) CardDef and current stats from the BoardMinion. The CardDef is never mutated.\" Why is \"never mutated\" the important word, rather than just \"copied\"?",
      choices: [
        "Because mutating an object is measurably slower than copying one in JavaScript.",
        "Because CardDefs are stored on disk and can't technically be changed at runtime.",
        "Because a `CardDef` is shared — the SAME object backs every minion of that card, across every board and every combat — so if `instantiate()` edited it directly, changing one minion's stats in one fight would silently corrupt every other minion built from that card, anywhere.",
        "It isn't actually important — the comment is just stylistic phrasing."
      ],
      answer: 2,
      explanation: "A `CardDef` (\"this is what a Gnasher is\") is loaded once and reused everywhere that card appears — not a fresh copy per minion. If combat code mutated it directly, that change would leak into every OTHER Gnasher anywhere in the game, since they all point at the same object. `instantiate()` avoids this by building a brand-new `Minion` with its own fields, leaving the shared `CardDef` untouched — the same idea CLAUDE.md states directly: \"Never mutate shared CardDefs — clone into combat Minion instances.\" (A)/(B) aren't the documented reason.",
    },
    {
      topicId: "data-vs-code",
      topicLabel: "Data vs. code",
      question: "packages/content/src/schema.ts's <code>EffectFactoryIdSchema</code> is a `z.enum([...])` listing over a hundred string ids like `'deathrattleSummon'`, `'onKillBuffSelf'`, `'rallyCastSpell'`. A card's effect just picks one of these ids (plus params) — it is NOT a chunk of code that runs. Assuming `'deathrattleSummon'` already exists, what does this tell you about adding a new card whose ability is \"summon a copy of itself when it dies\"?",
      choices: [
        "Nothing — every new card requires writing new TypeScript code regardless of whether the ability already exists.",
        "The card would need its own dedicated class written from scratch, since every card is its own program.",
        "The enum is just documentation and has no bearing on what's actually possible in-game.",
        "If the desired behavior already has a matching id in this list, the new card can be added as pure DATA — an entry in the card's `effects` array referencing `'deathrattleSummon'` plus its params — with no new code. New code is only needed when the desired behavior needs an effect primitive that ISN'T already in this enum."
      ],
      answer: 3,
      explanation: "This is CLAUDE.md's \"cards are data, not bespoke classes\" rule made concrete: as long as the mechanic already exists as one of these ~100+ registered factory ids, a new card is just a data entry (`{ on: 'death', do: 'deathrattleSummon', params: {...} }`) — filling in a form, no programming needed. You only touch code — write a new factory function AND add its id here — when the behavior has genuinely never existed before. (A)/(B) overstate how much new content needs; (C) is wrong: this schema is zod-validated and actively restricts which `do` values are legal.",
    },
    {
      topicId: "event-log-replay",
      topicLabel: "Event log & replay",
      question: "packages/core/src/events.ts's `CombatBus.emit()` loops with <code>for (const handler of [...list]) handler(payload)</code> — spreading `list` into a brand-new array — instead of the simpler <code>for (const handler of list) handler(payload)</code>. Its comment notes: \"handlers may themselves cause emits (a Deathrattle summon → onSummon).\" Why does that make the plain, no-copy loop risky?",
      choices: [
        "It has no real effect — `[...list]` is just a stylistic habit some developers have.",
        "If a handler running mid-loop registers a NEW handler for the same event (e.g. a freshly-summoned minion joining combat), that push modifies the very array the `for...of` loop is iterating over live — hard to reason about. Snapshotting the list first means `emit()` always runs exactly the handlers that existed when it started; a new registration only affects the NEXT emit.",
        "`[...list]` makes the array sort itself into the correct order before iterating.",
        "It's required because JavaScript arrays can only be iterated with `for...of` a single time, ever."

      answer: 1,
      explanation: "This is a classic \"don't mutate the thing you're iterating\" bug shape: a `for...of` over a live array behaves unpredictably if something pushes to it mid-loop. Since a Deathrattle-summoned minion can register its own event handlers as a side effect of an event still being processed, `emit()` snapshots the list (`[...list]`) up front so the current call always processes a fixed, predictable set of handlers. This is exactly what keeps the resulting event log — the thing replay reads — consistent and reproducible. (A) understates a real correctness guard; (C)/(D) describe things spread syntax doesn't do.",
    },

        "Tools code runs in the browser, where `Math.random` behaves differently than in Node.",
        "It's banned everywhere in the whole repo, including packages/ui — this rule just happens to also mention tools."

      answer: 0,
      explanation: "Determinism isn't only a \"live engine\" concern — it matters anywhere output gets committed to the repo and needs to be exactly reproducible on demand. `npm run pool`'s output becomes checked-in data everyone relies on being stable; if it used `Math.random`, running the generator twice could produce two different \"correct\" pools with no way to tell which is right or regenerate a specific one. So the same discipline — route all randomness through the seeded `Rng` — extends to any tool producing committed artifacts. (D) is wrong: the UI is explicitly exempt (\"cosmetic only\") per the same comment; (B)/(C) aren't the documented reason.",

      answer: 2,
      explanation: "This is a general measurement lesson, not just a game-specific rule: averages hide outliers. If 99 frames take 2ms and one takes 20ms, the mean looks fine, but the player still feels that one 20ms hitch — averaging masks the exact thing performance work is trying to catch. The doc's own example (mean improved 24%, worst frame stayed ~4x over budget) is a case where a good-looking number papered over an unfixed problem. (D) has it backwards — the doc explicitly ranks worst frame ABOVE mean.",

  function renderQuestion() {

  function handleAnswer(idx, btnEl) {
    var q = QUESTIONS[current];
    var allBtns = choicesArea.querySelectorAll(".choice");

    verdictText.textContent = correct ? "✓ Correct!" : "✗ Not quite — correct answer is " + letters[q.answer] + ".";
    verdictText.className = "verdict " + (correct ? "good" : "bad");
    explanationText.innerHTML = q.explanation;
    explanationArea.classList.add("show");
    nextBtn.classList.add("show");
    nextBtn.textContent = (current === QUESTIONS.length - 1) ? "See final score →" : "Next question →";
  }

  nextBtn.addEventListener("click", function () {
    current++;
    if (current >= QUESTIONS.length) {
      showSummary();
    } else {
      renderQuestion();
    }
  });

  function showSummary() {
    quizArea.classList.add("hidden");
    summaryArea.classList.remove("hidden");
    document.getElementById("summaryScore").textContent = score + " / " + QUESTIONS.length;
    var pct = Math.round((score / QUESTIONS.length) * 100);
    document.getElementById("summaryPct").textContent = pct + "%";
    var msg;
    if (score === QUESTIONS.length) {
      msg = "Perfect score! You're reading this codebase like it's your own — because it is. 🎉";
    } else if (score >= 8) {
      msg = "Great run — you clearly know your way around this engine. A couple of these were genuinely tricky.";
    } else if (score >= 6) {
      msg = "Solid! You're picking up the architecture steadily — reply with your score and which ones tripped you up, and tomorrow's quiz will circle back to them.";
    } else if (score >= 4) {
      msg = "Good effort — this is how learning a codebase actually feels. Tell me your score and we'll re-teach the tricky spots from a fresh angle.";
    } else {
      msg = "That's alright — these were dense ones today. Reply with your score and we'll slow down and revisit these topics soon.";
    }
    document.getElementById("summaryEncourage").textContent = msg;
  }

  renderQuestion();
})();
</script>
</body>
</html>
