<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile: lock zoom (the board handles its own scaling), cover the notch/safe areas, and set the browser
         theme colour to the dark board frame so the status bar blends in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#160f08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- PWA: "Add to Home Screen" installs a standalone, chrome-free fullscreen app (the only real
         fullscreen on iOS — Safari has no fullscreen API for games, so itch's fullscreen button is a no-op there). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>ASCENT</title>
    <!-- FIRST-PAINT SPLASH. Fetched with high priority so it is on screen before the ~3 MB JS bundle has even
         parsed — a React-rendered splash cannot appear until after that, which on a cold load is the exact
         second the screen is blank. -->
    <link rel="preload" as="image" href="./ascenticon.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- THE BOOT SPLASH lives in the document, not in React, for one reason: it must paint on the FIRST frame.
         Its CSS is inlined here for the same reason — waiting on the stylesheet (which ships with the bundle)
         would reintroduce the blank gap this exists to remove.

         `Boot` (packages/ui/src/Boot.tsx) owns the rest of its life: it holds the splash for a FIXED 3.5s (the
         bar fills via pure CSS over the same 3.5s), then adds `.is-out` to fade it and removes the node on
         transitionend. Fading OPACITY only —
         compositor-only, per docs/performance.md; a filter/background fade here would repaint the whole
         viewport on every frame of the transition. -->
    <div id="bootsplash">
      <img id="bootsplash-img" src="./ascenticon.png" alt="" aria-hidden="true" draggable="false" />
      <div id="bootsplash-bar"><i></i></div>
    </div>
    <script>
      /* Fade the splash IN once the image has actually DECODED (owner ask 2026-08-22: "fade in from a black
         screen"). Deliberately not a bare CSS animation: that starts on parse, so on a cold fetch it would
         run its course against nothing and the art would pop in at full opacity partway through. Keyed to
         `load` instead, the fade always shows the image itself.

         Inline and tiny on purpose — it must run before the ~3 MB bundle, which is the whole point of the
         splash. `error` also reveals, so a missing file leaves black rather than a stuck invisible layer. */
      /* Apply the DEV Load Screen tuner's saved size/position BEFORE the splash paints, so a tuned dev build is
         WYSIWYG with no resize flash. Absent for everyone who never opened the tuner (prod users included) →
         the CSS fallbacks stand. Kept tiny + defensive; it must run before the ~3 MB bundle. */
      (function () {
        try {
          var raw = localStorage.getItem('ascent.loadscreen');
          if (!raw) return;
          var c = JSON.parse(raw), r = document.documentElement.style;
          if (typeof c.iconSize === 'number') r.setProperty('--ls-icon', c.iconSize + 'px');
          if (typeof c.barWidth === 'number') r.setProperty('--ls-bar-w', c.barWidth + 'px');
          if (typeof c.barHeight === 'number') r.setProperty('--ls-bar-h', c.barHeight + 'px');
          if (typeof c.barBottom === 'number') r.setProperty('--ls-bar-bottom', c.barBottom + 'vh');
          if (typeof c.gradCenter === 'string') r.setProperty('--ls-grad-center', c.gradCenter);
          if (typeof c.gradEdge === 'string') r.setProperty('--ls-grad-edge', c.gradEdge);
          if (typeof c.gradSize === 'number') r.setProperty('--ls-grad-size', c.gradSize + '%');
          if (typeof c.gradPosX === 'number') r.setProperty('--ls-grad-x', c.gradPosX + '%');
          if (typeof c.gradPosY === 'number') r.setProperty('--ls-grad-y', c.gradPosY + '%');
        } catch (e) { /* ignore */ }
      })();
      (function () {
        var s = document.getElementById('bootsplash');
        var i = document.getElementById('bootsplash-img');
        if (!s || !i) return;
        var reveal = function () {
          /* Stamp WHEN the fade-in began. Boot reads it so it can never start the fade-OUT while the art is
             still fading IN — on a warm cache the gate resolves in well under the in-fade, and yanking a
             half-visible image away reads as a flicker rather than a dissolve. */
          s.dataset.inAt = String(Math.round(performance.now()));
          s.classList.add('is-in');
        };
        if (i.complete && i.naturalWidth > 0) reveal();
        else {
          i.addEventListener('load', reveal, { once: true });
          i.addEventListener('error', reveal, { once: true });
        }
      })();
    </script>
    <style>
      /* A BLACK CSS GRADIENT from the very first frame (owner ask 2026-08-24, replacing the full-bleed image):
         the AscentIcon logo fades UP onto it (`.is-in`), then the whole thing fades DOWN onto the mounted menu
         (`.is-out`). A soft radial lift at centre keeps it from reading as a flat void behind the mark. */
      #bootsplash {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(ellipse var(--ls-grad-size, 60%) var(--ls-grad-size, 60%) at var(--ls-grad-x, 50%) var(--ls-grad-y, 50%), var(--ls-grad-center, #24468a) 0%, var(--ls-grad-edge, #0a1730) 100%);
        opacity: 1; transition: opacity 900ms cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; align-items: center; justify-content: center;
      }
      /* The AscentIcon is a square logo — centred, not full-bleed. Sized to the smaller viewport axis so it
         never crowds a short or narrow window. */
      #bootsplash-img {
        /* `--ls-icon` etc. are set by the DEV Load Screen tuner (loadScreenConfig.ts); the fallbacks here are
           the shipped values and MUST mirror its DEFAULTS. */
        width: var(--ls-icon, min(570px, 42vw, 42vh)); height: auto; aspect-ratio: 1;
        object-fit: contain;
        opacity: 0; transition: opacity 700ms ease-out;
        filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.55));
      }
      #bootsplash.is-in #bootsplash-img { opacity: 1; }
      #bootsplash.is-out { opacity: 0; pointer-events: none; }
      #bootsplash-bar {
        position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--ls-bar-bottom, 22.5vh);
        width: var(--ls-bar-w, min(413px, 46vw)); height: var(--ls-bar-h, 8px); border-radius: 999px;
        background: rgba(255, 255, 255, 0.1); overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        opacity: 0; transition: opacity 700ms ease-out;   /* arrives with the logo, not before it */
      }
      #bootsplash.is-in #bootsplash-bar { opacity: 1; }
      /* FAKE LOAD (owner ask 2026-08-24, made absolute 2026-08-25): the fill is a pure CSS transition — scaleX
         0→1 over 3.5s the moment the splash reveals — and is not driven by real art progress. scaleX (not width)
         so the whole animation is compositor-only, never a per-frame layout. The duration MUST match `SPLASH_MS`
         in Boot.tsx: that timer is now the ONLY thing gating the menu, so the bar finishing and the splash
         leaving are the same moment, whatever the real loading is doing. */
      #bootsplash-bar > i {
        display: block; height: 100%; border-radius: 999px; background: #f0902e;
        transform: scaleX(0); transform-origin: left center;
      }
      /* The fill is a keyframe ANIMATION, not a transition. A transition needs its scaleX(0) START state to have
         been PAINTED in a prior frame — but the AscentIcon loads before the first paint on any warm/dev load, so
         `.is-in` lands in the same frame the bar first renders and the transition has no "before" to animate
         from: the bar just SNAPS full (owner report 2026-08-26: "instantly full"). An animation runs from its 0%
         keyframe unconditionally, so it always fills over the 3.5s regardless of when `.is-in` is added. Keep the
         duration in sync with `SPLASH_MS` in Boot.tsx (the gate opens when the fill completes). */
      @keyframes bootbarfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      #bootsplash.is-in #bootsplash-bar > i { animation: bootbarfill 3500ms linear forwards; }
      /* The bar is progress feedback, not decoration — freeze motion for anyone who asked for less. */
      @media (prefers-reduced-motion: reduce) {
        #bootsplash, #bootsplash-img, #bootsplash-bar { transition: none; }
        #bootsplash-bar > i, #bootsplash.is-in #bootsplash-bar > i { animation: none; transform: scaleX(1); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
