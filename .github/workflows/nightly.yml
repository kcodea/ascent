# DOCBOT NIGHTLY (handoff §9.2 + §13.3, PR 8) — the long-horizon QA lane the PR gate never pays for.
#
# Deliberately ADDITIVE: this workflow is separate from ci.yml and is NOT a required check, so it can never
# block an ordinary PR. It runs full deterministic lifecycle runs + the lobby sweep on a schedule (off-peak)
# and on demand; a red run uploads the artifact directory — the nightly report, machine-readable findings
# (fingerprinted, §12), and for every failure a minimized QaScenarioV1 with its exact repro command plus the
# original seed/trace as secondary evidence (§9.3). Every failure reproduces locally by seed — no flaky
# probability gates (§13.4).
name: Docbot Nightly

on:
  schedule:
    # 09:17 UTC — off-peak for both devs; the odd minute avoids GitHub's on-the-hour scheduling congestion.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Lifecycle runs to execute'
        required: false
        default: '6'

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the nightly lifecycle lane
        run: npm run docbot:nightly -- --runs ${{ github.event.inputs.runs || '6' }} --out artifacts/docbot-nightly

      # WP G (§17.2): the nightly grows the FULL sweeps the PR gate only samples. Both `continue-on-error`
      # — a red sweep is a FINDING to triage, and its findings.json must still reach the upload step. The
      # per-sweep exit codes stay visible in the job log; the artifact is what a reviewer opens.
      - name: Full contract sweep (the PR gate only samples)
        continue-on-error: true
        run: npm run docbot:contracts -- --out artifacts/docbot-contracts
      - name: Full pairwise interaction sweep + anomaly oracle
        continue-on-error: true
        run: npm run docbot:interactions -- --out artifacts/docbot-interactions

      # Every lane emits the same byte-stable findings.json, so one fold turns the whole night into the
      # §12.3 ledger the QA Workbench inbox reads.
      - name: Fold the night's findings into a ledger (§12.3)
        if: always()
        run: npm run docbot:ledger -- --in artifacts --ledger artifacts/ledger.json --print 20

      - name: Upload artifacts (reports + findings + ledger always; scenarios/traces on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docbot-nightly-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
