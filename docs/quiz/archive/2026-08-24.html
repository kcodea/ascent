<style>

  :root[data-theme="dark"] {
    --bg: #17181c;
    --panel: #1f2025;
    --panel-border: #2d2f36;

    --muted: #96958c;

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);

  }
  .choice:hover:not(:disabled) {
    border-color: var(--accent-border);
    background: var(--accent-soft);
  }
  .choice:focus-visible {
    outline: 2px solid var(--accent);

  }
  .choice.correct { border-color: var(--correct-border); background: var(--correct-bg); }
  .choice.correct .letter { background: var(--correct); color: var(--panel); }
  .choice.wrong { border-color: var(--wrong-border); background: var(--wrong-bg); }
  .choice.wrong .letter { background: var(--wrong); color: var(--panel); }

  }
  .explain.show { display: block; }
  .explain code {

  .nextbtn {
    margin-top: 18px;

  .nextbtn.show { display: inline-block; }
  .nextbtn:hover { filter: brightness(1.1); }
  .nextbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .summary { text-align: center; padding: 40px 24px; }
  .summary .line { color: var(--muted); font-size: 0.95rem; }
  .summary .score {

  .summary .encourage { margin-top: 16px; font-size: 1.05rem; max-width: 46ch; margin-left: auto; margin-right: auto; text-wrap: balance; }

<body>
<div class="wrap">
  <header>
    <div class="kicker">docs/quiz · daily architecture quiz</div>
    <h1>Ascent Quiz #12</h1>
    <p>2026-08-24 · 10 questions on how the game is actually coded</p>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status-row">
    <span id="qCounter">Question 1 / 10</span>
    <span id="scoreCounter">Score: 0</span>
  </div>
  <div id="quizArea"></div>
  <footer>Graded right here in your browser — nothing leaves this page.</footer>
</div>

<script>
const QUESTIONS = [
  {
    topic: "what-is-a-function",
    question: "packages/core/src/rng.ts's <code>next()</code> method takes ZERO parameters — no seed, no arguments — yet it returns a different number nearly every time you call it. Looking at how <code>makeRng(seed)</code> is written (<code>let a = seed | 0; const next = () =&gt; { a = ...; return ...; }</code>), what actually lets a function with no inputs still produce a new value on each call?",
    choices: [
      "It secretly calls Math.random() internally to top up its randomness",
      "It reads and updates the variable <code>a</code>, which lives outside <code>next()</code> but inside the enclosing <code>makeRng()</code> — so each call remembers where the last call left off",
      "JavaScript automatically varies the output of any function that takes no parameters",
      "It silently re-reads the original <code>seed</code> argument fresh on every call"
    ],
    answer: 1,
    explanation: "<code>next()</code> is defined inside <code>makeRng(seed)</code> and closes over the outer variable <code>a</code> — every call mutates <code>a</code> and computes a new value from it, so the function \"remembers\" state between calls even though it takes no parameters of its own. That pattern — a function keeping private, persistent state via a variable from its enclosing scope — is called a closure. It isn't Math.random() (banned in core) and it isn't re-reading <code>seed</code>; <code>seed</code> is only used once, on the very first line, to set the starting value of <code>a</code>."
  },
  {
    topic: "deterministic-sim",
    question: "CLAUDE.md says being deterministic \"buys replays, shareable seeds, daily runs, and cheap exact balance sims.\" What do all four of those things actually depend on?",
    choices: [
      "The engine running as fast as possible",
      "Feeding the exact same seed and inputs into simulate() always producing the exact same outcome, every time",
      "The UI animating every combat identically frame-for-frame",
      "Cards always keeping the same stats regardless of upgrades"
    ],
    answer: 1,
    explanation: "Each of those four features only works if re-running the sim with the same seed/boards reproduces the identical result: a replay is just \"run it again and watch,\" a shared seed only makes sense if it plays out the same for everyone who uses it, a daily run needs every player to face the same fight, and a balance sim needs to trust that one deterministic run stands in for what would happen. None of that is really about raw speed, the UI's animation, or card stats staying fixed — those are separate concerns from determinism itself."
  },
  {
    topic: "seeded-rng",
    question: "rng.ts's <code>int(maxExclusive)</code> method is written as <code>Math.floor(next() * maxExclusive)</code>, where <code>next()</code> always returns a float in [0, 1). Why is the <code>Math.floor(...)</code> there instead of just using <code>next() * maxExclusive</code> directly?",
    choices: [
      "To make the calculation run faster",
      "To turn a fractional result like 2.83 into a whole number the caller can actually use as an array index or a count",
      "To guarantee the result is always a positive number",
      "To round the result to the NEAREST whole number, rather than truncating it"
    ],
    answer: 1,
    explanation: "<code>next() * maxExclusive</code> produces a fractional value (e.g. 2.83 for maxExclusive = 5); callers like <code>pick()</code> need a valid whole-number index, so <code>Math.floor</code> truncates down to the integer part (2), keeping the result inside the valid range [0, maxExclusive). It isn't about speed, and <code>next()</code> is already non-negative so sign isn't the issue either. And it's truncation, not rounding — <code>Math.floor</code> always rounds DOWN, so 2.99 becomes 2, never 3."
  },
  {
    topic: "sim-ui-decoupling",
    question: "Suppose a player's laptop is old and the combat animation stutters badly on screen. Per Ascent's sim/UI split — where <code>simulate()</code> computes the whole outcome up front and the UI just replays the resulting event log at its own pace — does that laggy animation change who actually wins the fight?",
    choices: [
      "Yes — a slower frame rate can make simulate() recompute the outcome differently",
      "No — the winner was already fully decided by simulate() before any animation started; the laggy playback only changes how it LOOKS, never what happened",
      "Yes, but only if the stutter happens to land during a Deathrattle",
      "No, but only because the game pauses simulate() until the animation catches up"
    ],
    answer: 1,
    explanation: "simulate() runs to completion and returns a finished, fixed events array before the UI ever starts animating anything — the outcome is already fully decided. The UI then paces that fixed log on its own clock, so a stuttering frame rate changes the viewing experience, never the result. There's no live feedback loop from rendering back into the sim — that's exactly what \"decoupled\" means here."
  },
  {
    topic: "monorepo-packages",
    question: "packages/ui/package.json lists dependencies like react, zustand, gsap, and pixi.js — libraries that packages/core, packages/content, and packages/sim do NOT depend on. What does that tell you about where UI-specific libraries belong in this monorepo?",
    choices: [
      "They should really be installed once at the repo root so every package can reach them",
      "Presentation libraries belong ONLY in the ui package — core/content/sim stay framework-agnostic so the engine can run (and be tested) without a browser at all",
      "It's an inconsistency that should be fixed by adding React to core as well",
      "It means packages/ui is the only package that has any automated tests"
    ],
    answer: 1,
    explanation: "Keeping React/GSAP/Pixi out of core, content, and sim means the entire engine can run in plain Node — npm run harness, npm test, the balance tools — with no browser or rendering library involved at all. That's a deliberate architectural choice, not an accident to be \"fixed.\" It isn't about install location, and every package has its own tests regardless of which libraries it depends on."
  },
  {
    topic: "pure-functions",
    question: "A pure function has two properties: (1) the same inputs always produce the same output, and (2) it doesn't do anything ELSE besides compute and return that output. simulate() never mutates the board arrays it's given and never touches the DOM or console. Which property of purity does THAT specifically demonstrate?",
    choices: [
      "Property 1 — same inputs, same output",
      "Property 2 — no side effects: it doesn't change or affect anything outside itself",
      "Neither — mutation and side effects aren't actually related to purity",
      "Both properties equally, since they're really just the same requirement"
    ],
    answer: 1,
    explanation: "Not mutating its inputs and not touching anything external (DOM, console, network) is exactly what \"no side effects\" means — the function's only observable effect is its return value. That's a distinct requirement from \"same input → same output\": a function could technically always return the same thing for a given input while ALSO secretly logging to the console or mutating a global, which would violate purity by breaking this second property even though the first one still holds."
  },
  {
    topic: "data-vs-code",
    question: "Because a card like Pennycat is a plain object (attack, health, tribe, effects: [...]) instead of a class with methods, a script in packages/tools can loop over every single card and read its fields directly — no game engine, no combat, nothing actually \"running.\" Why does that matter for a balance-checking tool?",
    choices: [
      "It doesn't really matter — the tool has to simulate real games to check balance either way",
      "It lets the tool inspect and analyze every card's numbers directly, without needing to execute any of the card's behavior first",
      "It means the tool can only check cards that have no effects at all",
      "Plain objects simply run faster than class instances in JavaScript"
    ],
    answer: 1,
    explanation: "Data can be read and analyzed with zero execution — a script can iterate every card and check attack/health/tier patterns instantly. If a card's behavior were locked inside a class's methods instead, there'd be no simple way to \"read\" what it does without actually running that code in some scenario. This has nothing to do with raw JS performance, and it isn't limited to effect-less cards — <code>effects</code> is just another field the tool can read like any other."
  },
  {
    topic: "event-log-replay",
    question: "simulate()'s returned <code>events</code> array is plain, serializable data — numbers, strings, small objects — not live class instances with methods attached. Why does that specifically matter, beyond just being convenient to loop over?",
    choices: [
      "It means the array is automatically encrypted for security",
      "Plain data can be saved, sent elsewhere, or locked into a test snapshot and later replayed exactly — a live object carrying methods/closures generally can't survive that round trip the same way",
      "It has no real benefit — any JS value could be looped over the same way regardless",
      "It makes simulate() run measurably faster than if it returned objects with methods"
    ],
    answer: 1,
    explanation: "Because the events are plain data, they survive being serialized and reconstructed, so they can be persisted (saved alongside a run for later playback) or checked against a golden test snapshot — you can't reliably do that with an object carrying live methods and closures. That's a real, specific benefit of the log being data rather than behavior, and it's about serializability, not encryption or raw execution speed."
  },
  {
    topic: "eslint-rules",
    question: "eslint.config.mjs's Math.random ban has a <code>files:</code> array listing exactly <code>packages/core/**</code>, <code>packages/content/**</code>, <code>packages/sim/**</code>, and <code>packages/tools/**</code> — packages/ui is NOT in that list. What does scoping a rule to a specific <code>files:</code> glob like this actually let ESLint do?",
    choices: [
      "Apply a rule to only some parts of the codebase, instead of to every file the whole config touches",
      "Run that particular rule faster by skipping type-checking on it",
      "Automatically auto-fix violations, but only inside the listed files",
      "Nothing — ESLint rules always apply repo-wide no matter what <code>files:</code> says"
    ],
    answer: 0,
    explanation: "The <code>files:</code> key scopes that rule object to just the matching paths, so no-restricted-properties (banning Math.random) only fires inside core/content/sim/tools — packages/ui, where randomness is purely cosmetic, is left alone entirely. That's exactly why the UI doesn't need the ban: it's excluded by the glob itself, not by some special-case exemption elsewhere in the code. <code>files:</code> doesn't touch autofix behavior or type-checking speed, and it very much does change which files a rule applies to."
  },
  {
    topic: "performance-memo",
    question: "CLAUDE.md says for a \"breathing glow\" effect, animate the OPACITY of a <code>::before</code> element with a STATIC box-shadow, rather than animating the box-shadow itself in a loop. Why does that specific swap matter for performance?",
    choices: [
      "box-shadow and opacity look visually identical, so which one you pick doesn't actually matter",
      "box-shadow is a paint property the browser has to repaint every frame it changes; opacity is compositor-only, so animating it avoids repainting on every frame of the loop",
      "<code>::before</code> elements are automatically rendered on a separate GPU thread no matter what property is animated",
      "A static box-shadow is invisible, so this trick is really just a roundabout way of disabling the glow"
    ],
    answer: 1,
    explanation: "Repeatedly changing box-shadow forces the browser to repaint the affected region every single frame — expensive, looping work. Keeping the box-shadow fixed and instead animating opacity (a compositor-only property) lets the browser just blend layers on the GPU without repainting, which is why CLAUDE.md calls this out as the load-bearing performance rule for looping animations. The two properties don't just happen to look the same — the point is reaching a similar visual result through a much cheaper mechanism."
  }
];

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreCounter = document.getElementById('scoreCounter');

function render() {
  if (current >= QUESTIONS.length) {
    renderSummary();
    return;
  }
  const q = QUESTIONS[current];
  answered = false;
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
  qCounter.textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;

  const letters = ['A', 'B', 'C', 'D'];
  quizArea.innerHTML = `
    <div class="card">
      <span class="qtag">${q.topic}</span>
      <p class="qtext">${q.question}</p>
      <div class="choices" id="choicesWrap">
        ${q.choices.map((c, i) => `
          <button class="choice" data-idx="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${c}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="nextbtn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'See results →' : 'Next question →'}</button>
    </div>
  `;

  const buttons = quizArea.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const correct = idx === q.answer;
      if (correct) score++;
      buttons.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.getAttribute('data-idx'), 10);
        if (bi === q.answer) b.classList.add('correct');
        else if (bi === idx) b.classList.add('wrong');
      });
      const explainBox = document.getElementById('explainBox');
      explainBox.innerHTML = (correct ? '✅ <strong>Correct!</strong> ' : '❌ <strong>Not quite.</strong> ') + q.explanation;
      explainBox.classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
      scoreCounter.textContent = `Score: ${score}`;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    render();
  });
}

function renderSummary() {
  progressFill.style.width = '100%';
  qCounter.textContent = `Question ${QUESTIONS.length} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let line;
  if (pct === 100) line = "Perfect score! You're reading this codebase like you wrote it.";
  else if (pct >= 80) line = "Great work — you're building real intuition for how this all fits together.";
  else if (pct >= 50) line = "Solid effort — a few concepts to revisit, and it'll click more each day.";
  else line = "Everyone starts somewhere — re-read the explanations above, tomorrow's quiz will circle back.";

  quizArea.innerHTML = `
    <div class="card summary">
      <div class="line">Quiz complete</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="line">${pct}%</div>
      <div class="encourage">${line}</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
