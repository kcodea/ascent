    explanation: "There's no technical requirement forcing tests to live next to their source — option A is false, since Vitest's glob would happily match a separate folder too. The real value is organizational: proximity makes a test easy to locate and easy to remember to update when the file it covers changes, and because the glob is a broad <code>packages/**/*.test.ts</code> pattern, any new co-located test file is picked up automatically with no per-file registration step. Option B is wrong and would be worrying if true — test files are never meant to ship in the production bundle. Option C is also wrong: <code>typecheck:pkgs</code>/<code>typecheck:web</code> use their own separate <code>tsconfig</code> <code>include</code> patterns, unrelated to Vitest's config."
  }
];

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreCounter = document.getElementById('scoreCounter');

function render() {
  if (current >= QUESTIONS.length) {
    renderSummary();
    return;
  }
  const q = QUESTIONS[current];
  answered = false;
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
  qCounter.textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;

  const letters = ['A', 'B', 'C', 'D'];
  quizArea.innerHTML = `
    <div class="card">
      <span class="qtag">${q.topic}</span>
      <p class="qtext">${q.question}</p>
      <div class="choices" id="choicesWrap">
        ${q.choices.map((c, i) => `
          <button class="choice" data-idx="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${c}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="nextbtn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'See results →' : 'Next question →'}</button>
    </div>
  `;

  const buttons = quizArea.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const correct = idx === q.answer;
      if (correct) score++;
      buttons.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.getAttribute('data-idx'), 10);
        if (bi === q.answer) b.classList.add('correct');
        else if (bi === idx) b.classList.add('wrong');
      });
      const explainBox = document.getElementById('explainBox');
      explainBox.innerHTML = (correct ? '✅ <strong>Correct!</strong> ' : '❌ <strong>Not quite.</strong> ') + q.explanation;
      explainBox.classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
      scoreCounter.textContent = `Score: ${score}`;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    render();
  });
}

function renderSummary() {
  progressFill.style.width = '100%';
  qCounter.textContent = `Question ${QUESTIONS.length} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let line;
  if (pct === 100) line = "Perfect score! You're reading this codebase like you wrote it.";
  else if (pct >= 80) line = "Great work — you're building real intuition for how this all fits together.";
  else if (pct >= 50) line = "Solid effort — a few concepts to revisit, and it'll click more each day.";
  else line = "Everyone starts somewhere — re-read the explanations above, tomorrow's quiz will circle back.";

  quizArea.innerHTML = `
    <div class="card summary">
      <div class="line">Quiz complete</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="line">${pct}%</div>
      <div class="encourage">${line}</div>
    </div>
  `;
}

render();
</script>

</html>
