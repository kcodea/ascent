<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chest Shop mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
  /* Game tokens copied from packages/ui/src/uiTheme.css + collection.css (the Gem plate). Art served by the dev server. */
  :root {
    --art: http://localhost:5230/;
    --ui-plate-top: #382950; --ui-plate-mid: #21173a; --ui-plate-bot: #170f29;
    --ui-edge-hi: #ffe9b0; --ui-edge-main: #c8953f; --ui-edge-deep: #7a571f; --ui-edge-lo: #e8c27a;
    --ui-ring: rgba(255, 217, 138, 0.2); --ui-text: #fff1d6; --ui-muted: #c6b8d8; --ui-title: #ffd98a;
    --ui-hover-top: #4a3768; --ui-hover-mid: #2d2050; --ui-hover-bot: #1f1638;
    --ui-hover-edge-hi: #fff6d6; --ui-hover-edge-main: #ffd27a; --ui-hover-edge-deep: #b98a3a; --ui-hover-edge-lo: #ffe3a0;
    --ui-plate: linear-gradient(180deg, var(--ui-plate-top) 0%, var(--ui-plate-mid) 55%, var(--ui-plate-bot) 100%);
    --ui-edge: linear-gradient(180deg, var(--ui-edge-hi) 0%, var(--ui-edge-main) 30%, var(--ui-edge-deep) 56%, var(--ui-edge-main) 80%, var(--ui-edge-lo) 100%);
    --ui-hover-plate: linear-gradient(180deg, var(--ui-hover-top) 0%, var(--ui-hover-mid) 55%, var(--ui-hover-bot) 100%);
    --ui-hover-edge: linear-gradient(180deg, var(--ui-hover-edge-hi) 0%, var(--ui-hover-edge-main) 40%, var(--ui-hover-edge-deep) 65%, var(--ui-hover-edge-lo) 100%);
    --ui-sheen: radial-gradient(110% 70% at 50% 0%, rgba(255,255,255,0.15), rgba(255,255,255,0.03) 55%, rgba(255,255,255,0) 75%);
    --ui-bevel: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -4px 6px -4px rgba(0,0,0,0.7);
    --colls-gold: #e8c877; --colls-ink: #fff6e4; --colls-dim: rgba(255,246,228,0.62); --colls-line: rgba(196,160,92,0.32);
    --colls-panel: linear-gradient(180deg, rgba(13,22,40,0.82), rgba(8,14,28,0.9));
    --font-ui: 'Outfit', sans-serif; --font-body: 'Nunito Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-ui); color: var(--colls-ink);
    background: linear-gradient(180deg, rgba(6,10,22,0.55), rgba(6,10,22,0.85)), url('http://localhost:5230/backdrops/hall-dim.webp') center/cover fixed, #0a0f1e;
    cursor: url('http://localhost:5230/cursors/gauntlet.svg') 6 2, auto;
  }
  button { font: inherit; color: inherit; cursor: url('http://localhost:5230/cursors/gauntlet_open.svg') 6 2, pointer; }
  .note { text-align: center; font: 600 12px var(--font-body); color: rgba(255,255,255,0.45); }

  .page { max-width: 1560px; margin: 0 auto; padding: 22px 34px 30px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }

  /* Gem plate grammar */
  .gem { border: 2px solid transparent; border-radius: 10px;
    background: var(--ui-sheen) padding-box, var(--ui-plate) padding-box, var(--ui-edge) border-box;
    box-shadow: var(--ui-bevel), inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px var(--ui-ring), 0 3px 10px -3px rgba(0,0,0,0.7);
    color: var(--ui-text); text-shadow: 0 1px 0 rgba(0,0,0,0.7); font-family: var(--font-body); font-weight: 700; }
  .gem:hover { color: #fff; background: var(--ui-sheen) padding-box, var(--ui-hover-plate) padding-box, var(--ui-hover-edge) border-box; }

  .aeth { width: 1.15em; height: 1.15em; vertical-align: -0.22em; margin-right: 0.18em; }

  /* Top bar */
  .top { display: flex; align-items: center; gap: 18px; }
  .back { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; font-size: 16px; }
  .title { font-weight: 900; font-size: 34px; letter-spacing: 0.02em; color: var(--ui-title); text-shadow: 0 2px 0 rgba(0,0,0,0.6); }
  .spacer { flex: 1; }
  .wallet { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 12px; font-size: 22px; font-weight: 800; border-radius: 999px; }
  .wallet small { font-size: 14px; color: var(--ui-muted); font-weight: 700; }

  /* Section heading with the game's name divider underneath */
  .sec-h { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sec-h span { font-weight: 900; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--colls-gold); }
  .sec-h em { font-style: normal; font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--colls-dim); letter-spacing: 0; text-transform: none; }
  .sec-h img { width: 360px; height: auto; opacity: 0.9; }

  /* Chest row */
  .chests { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
  .chest { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 14px;
    border-radius: 16px; background: var(--colls-panel); border: 2px solid var(--colls-line);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.7);
    transition: transform 0.14s ease, border-color 0.14s ease; }
  .chest::before { /* tier-coloured floor glow (static) */
    content: ''; position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
    background: radial-gradient(60% 40% at 50% 62%, color-mix(in srgb, var(--tc) 30%, transparent), transparent 70%); opacity: 0.55; }
  .chest:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--tc) 60%, var(--colls-line)); }
  .chest.on { border-color: var(--tc); transform: translateY(-4px);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--tc) 45%, transparent), 0 0 26px -4px color-mix(in srgb, var(--tc) 70%, transparent), inset 0 0 40px rgba(0,0,0,0.3); }
  .chest.on::before { opacity: 1; }
  .chest canvas { position: relative; width: 100%; max-width: 230px; height: auto; aspect-ratio: 840 / 620; filter: drop-shadow(0 14px 12px rgba(0,0,0,0.55)); }
  .tname { position: relative; font-weight: 900; font-size: 22px; color: var(--tc); text-shadow: 0 2px 0 rgba(0,0,0,0.6); }
  .ancient .tname { background: linear-gradient(90deg, #8af5ff, #f4eeff 45%, #ff9bf0); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.6)); }
  /* Hover tip: the game's rich tooltip skin (tooltips.css .atip), dropped below the card */
  .tip { position: absolute; left: 50%; top: calc(100% + 12px); z-index: 20; width: 260px; transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease;
    padding: 12px 16px 13px; text-align: left; border: 1px solid transparent; border-top-width: 2px; border-radius: 12px;
    background: var(--ui-sheen) padding-box, var(--ui-plate) padding-box, var(--ui-edge) border-box;
    box-shadow: 0 14px 34px -10px rgba(0,0,0,0.72), 0 2px 6px -2px rgba(0,0,0,0.5), var(--ui-bevel), inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px var(--ui-ring);
    font-family: var(--font-body); font-weight: 600; font-size: 16px; line-height: 1.42; color: var(--ui-text); text-shadow: none; }
  .chest:hover .tip { opacity: 1; transform: translate(-50%, 0); }
  .chest:hover { z-index: 10; }
  .tip-t { font-family: var(--font-ui); font-weight: 800; font-size: 17px; color: var(--ui-title); }
  .tip-g { color: var(--ui-text); padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,217,138,0.2); }
  .tip-r { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
  .tip-r b { font-weight: 800; }
  .tip-r span { color: var(--ui-text); }
  .tprice { position: relative; margin-top: 4px; padding: 5px 16px; border-radius: 999px; font-size: 18px; font-variant-numeric: tabular-nums; }
  .chest.on .tprice { color: var(--ui-title); }
  .pick { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center;
    background: var(--tc); color: #140d24; font-weight: 900; font-size: 15px; }
  .ancient .pick { background: linear-gradient(135deg, #8af5ff, #f4eeff, #ff9bf0); }
  .chest.on .pick { display: grid; }

  /* ── SELECTING A CHEST: it gets more exciting with every tier ──────────────────────────────────────────────
     Per tier: --h hop height, --gl/--gs the selected halo's blur/spread. Everything moves by transform/opacity only;
     the one looping piece is a halo's OPACITY (static shadow) and the Legendary/Ancient rays' ROTATION. */
  .chest.standard { --h: 6;  --gl: 10; --gs: 0; }
  .chest.rare     { --h: 10; --gl: 16; --gs: 1; }
  .chest.epic     { --h: 15; --gl: 24; --gs: 3; }
  .chest.legendary{ --h: 21; --gl: 32; --gs: 5; }
  .chest.ancient  { --h: 28; --gl: 40; --gs: 7; }
  .chest canvas { z-index: 1; }
  .chest .tname, .chest .tprice, .chest .pick { z-index: 2; }
  .chest .clip { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; pointer-events: none; }
  /* steady selected halo, stronger per tier */
  .chest::after { content: ''; position: absolute; inset: -3px; border-radius: 16px; pointer-events: none; opacity: 0;
    box-shadow: 0 0 calc(var(--gl) * 1px) calc(var(--gs) * 1px) var(--tc); }
  .chest.ancient::after { box-shadow: -10px 0 calc(var(--gl) * 1px) calc(var(--gs) * 1px) #8af5ff, 10px 0 calc(var(--gl) * 1px) calc(var(--gs) * 1px) #ff9bf0, 0 0 calc(var(--gl) * 0.6px) 2px #f4eeff; }
  .chest.on::after { animation: halo 2s ease-in-out infinite; }
  /* Legendary + Ancient: slow rays turning behind the chest while selected */
  .chest .rays { position: absolute; left: 50%; top: 40%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; opacity: 0; transition: opacity 0.35s ease;
    background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--tc) 50%, transparent) 0deg 7deg, transparent 7deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 66%); mask: radial-gradient(circle, #000 18%, transparent 66%); }
  .chest.ancient .rays { background: repeating-conic-gradient(from 0deg, rgba(138,245,255,0.6) 0deg 6deg, transparent 6deg 16deg, rgba(255,155,240,0.55) 16deg 22deg, transparent 22deg 32deg, rgba(244,238,255,0.6) 32deg 38deg, transparent 38deg 48deg); }
  .chest.on.legendary .rays { opacity: 0.5; animation: spin 18s linear infinite; }
  .chest.on.ancient .rays { opacity: 0.75; animation: spin 11s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* the one-shot pop */
  .chest.pop canvas { animation: hop 0.65s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .chest.pop.epic canvas { animation: hopwiggle 0.75s cubic-bezier(0.3, 1.5, 0.5, 1); }
  .chest.pop.legendary { animation: shake-s 0.4s ease-out; }
  .chest.pop.ancient { animation: shake-l 0.55s ease-out; }
  .chest.pop.legendary canvas, .chest.pop.ancient canvas { animation: hopwiggle 0.85s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes hop { 0% { transform: none; } 35% { transform: translateY(calc(var(--h) * -1px)) scale(calc(1 + var(--h) * 0.006)); } 65% { transform: translateY(2px) scale(1.03, 0.96); } 100% { transform: none; } }
  @keyframes hopwiggle { 0% { transform: none; } 25% { transform: translateY(calc(var(--h) * -1px)) scale(calc(1 + var(--h) * 0.006)) rotate(-4deg); }
    45% { transform: translateY(calc(var(--h) * -0.8px)) scale(calc(1 + var(--h) * 0.006)) rotate(4deg); } 70% { transform: translateY(2px) scale(1.04, 0.95) rotate(0); } 100% { transform: none; } }
  @keyframes shake-s { 0%, 100% { transform: translateY(-4px); } 20% { transform: translate(-3px, -4px); } 40% { transform: translate(3px, -5px); } 60% { transform: translate(-2px, -4px); } 80% { transform: translate(2px, -4px); } }
  @keyframes shake-l { 0%, 100% { transform: translateY(-4px); } 12% { transform: translate(-7px, -6px) rotate(-1deg); } 26% { transform: translate(7px, -2px) rotate(1deg); } 40% { transform: translate(-5px, -6px); } 55% { transform: translate(5px, -3px); } 70% { transform: translate(-3px, -5px); } 85% { transform: translate(2px, -4px); } }
  .chest .flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.95), rgba(255,255,255,0.4) 30%, transparent 70%); }
  .chest.pop.legendary .flash { animation: flash 0.5s ease-out; }
  .chest.pop.ancient .flash { animation: flash 0.7s ease-out; }
  @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }
  .chest .csweep { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; opacity: 0; transform: translateX(-110%);
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--tc) 55%, transparent), transparent); }
  .chest.pop:is(.epic, .legendary, .ancient) .csweep { animation: csweep 0.7s ease-out 0.1s; }
  @keyframes csweep { 0% { opacity: 1; transform: translateX(-110%); } 100% { opacity: 0; transform: translateX(240%); } }
  .ringfx { position: absolute; left: 50%; top: 40%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; pointer-events: none; z-index: 3;
    border: 3px solid var(--c); box-shadow: 0 0 12px var(--c), inset 0 0 10px var(--c); opacity: 0; animation: ringx 0.7s ease-out forwards; }
  @keyframes ringx { 0% { opacity: 1; transform: scale(0.3); } 100% { opacity: 0; transform: scale(var(--rs)); } }
  .chest .spark { top: 40%; z-index: 3; }
  .mote { position: absolute; bottom: 30%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; pointer-events: none; z-index: 3;
    background: var(--c); box-shadow: 0 0 8px 2px var(--c); opacity: 0; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-150px) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .chest.pop, .chest.pop canvas, .chest.on::after, .chest.on .rays, .chest .flash, .chest .csweep { animation: none !important; } .ringfx, .mote, .chest .spark { display: none; } }

  /* Lower half: the focus list (left) beside the checkout (right) */
  .lower { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
  .panel { display: flex; flex-direction: column; gap: 14px; padding: 18px 22px; border-radius: 16px; background: var(--colls-panel); border: 2px solid rgba(196,160,92,0.5);
    box-shadow: inset 0 0 0 1px rgba(196,160,92,0.14), inset 0 0 40px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.7); }
  .panel-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .panel-h span { font-weight: 900; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--colls-gold); }
  .panel-h em { font-style: normal; font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--colls-dim); }

  /* Focus list: one category per row, name on the left, a toggle on the right that glows while on */
  .cats { display: flex; flex-direction: column; }
  /* Three columns, the same on every row: name | items left | toggle */
  .cat { display: grid; grid-template-columns: 210px 110px 1fr auto; align-items: center; gap: 14px; min-height: 52px; padding: 6px 4px 6px 10px; border-bottom: 1px solid rgba(196,160,92,0.16); }
  .cat .left { text-align: right; font-variant-numeric: tabular-nums; }
  .cat-head { min-height: 0; padding-top: 0; padding-bottom: 6px; }
  .cat-head span { font-family: var(--font-ui); font-weight: 900; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--colls-dim); }
  .cat-head span:nth-child(2) { text-align: right; }
  .cat:last-child { border-bottom: 0; }
  .cat .nm { font-family: var(--font-body); font-weight: 800; font-size: 18px; color: var(--colls-ink); transition: color 0.12s ease; }
  .cat .left { font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--colls-dim); }
  .cat .grow { flex: 1; }
  .cat { position: relative; }
  .cat.on { background: linear-gradient(90deg, rgba(255,217,138,0.10), rgba(255,217,138,0.03) 55%, transparent 80%); }
  .cat.on .nm, .cat.on .left { color: var(--ui-title); }

  /* THE TOGGLE. Off: a flat grey slab, almost switched off. On: a lit gold pill with a breathing halo. */
  .tog { position: relative; min-width: 118px; min-height: 42px; padding: 6px 18px; border-radius: 999px; font-size: 16px; }
  .tog .ck { display: inline-block; width: 1.1em; }
  .cat:not(.on) .tog, .cat:not(.on) .tog:hover {
    border-color: transparent;
    background: linear-gradient(180deg, #2b2a31, #1c1b21) padding-box, linear-gradient(180deg, #5d5c66, #34333b) border-box;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -3px 5px -3px rgba(0,0,0,0.6), 0 2px 6px -3px rgba(0,0,0,0.7);
    color: rgba(255,255,255,0.32); text-shadow: none; }
  .cat:not(.on) .tog:hover { color: rgba(255,255,255,0.6); background: linear-gradient(180deg, #34333b, #222128) padding-box, linear-gradient(180deg, #7a7984, #44434c) border-box; }
  .cat.on .tog, .cat.on .tog:hover {
    color: #2a1806; text-shadow: 0 1px 0 rgba(255,240,200,0.6); font-weight: 900;
    background: radial-gradient(110% 80% at 50% 0%, rgba(255,255,255,0.55), rgba(255,255,255,0) 60%) padding-box, var(--ui-edge) padding-box, linear-gradient(180deg, #fff6d6, #b98a3a) border-box;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), inset 0 -4px 6px -3px rgba(90,55,10,0.6), 0 0 0 1px rgba(255,217,138,0.6), 0 0 20px 2px rgba(255,190,80,0.55); }
  /* breathing halo: a static shadow whose OPACITY loops (the game's kwglow pattern, compositor-only) */
  .tog::before { content: ''; position: absolute; inset: -5px; border-radius: 999px; pointer-events: none; opacity: 0;
    box-shadow: 0 0 22px 6px rgba(255,200,90,0.75); }
  .cat.on .tog::before { animation: halo 1.8s ease-in-out infinite; }
  @keyframes halo { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

  /* THE POP (one-shot, on switching ON): the pill bounces, a ring blasts out, sparks fly, a light sweeps the row */
  .tog::after { content: ''; position: absolute; inset: 0; border-radius: 999px; border: 3px solid #fff1c4; opacity: 0; pointer-events: none; }
  .cat.pop .tog { animation: togpop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1); }
  .cat.pop .tog::after { animation: ring 0.6s ease-out; }
  .cat.pop .nm { animation: nmpop 0.45s ease-out; transform-origin: 0 50%; }
  @keyframes togpop { 0% { transform: scale(0.78); } 45% { transform: scale(1.24); } 75% { transform: scale(0.96); } 100% { transform: scale(1); } }
  @keyframes ring { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7, 2.3); } }
  @keyframes nmpop { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .spark { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; pointer-events: none; border-radius: 2px;
    background: var(--c); box-shadow: 0 0 8px 1px var(--c); transform: rotate(45deg); animation: spark 0.75s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0, 0) rotate(45deg) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(225deg) scale(0.2); } }
  .sweep { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 8px; }
  .sweep::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,225,150,0.35), transparent); transform: translateX(-110%); }
  .cat.pop .sweep::before { animation: sweep 0.6s ease-out; }
  @keyframes sweep { 0% { opacity: 1; transform: translateX(-110%); } 100% { opacity: 0; transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .cat.pop .tog, .cat.pop .tog::after, .cat.pop .nm, .cat.pop .sweep::before, .cat.on .tog::before { animation: none; } .spark { display: none; } }
  .cat.out { opacity: 0.4; pointer-events: none; }

  /* Checkout (now a column on the right) */
  .checkout { justify-content: space-between; }
  .receipt { display: grid; gap: 6px; font-family: var(--font-body); font-weight: 700; font-size: 16px; }
  .line { display: flex; align-items: baseline; gap: 10px; }
  .line .what { color: var(--colls-ink); }
  .line .what small { color: var(--colls-dim); font-size: 13px; }
  .line .dots { flex: 1; border-bottom: 1px dotted rgba(255,246,228,0.25); transform: translateY(-4px); }
  .line .amt { font-variant-numeric: tabular-nums; color: var(--colls-ink); white-space: nowrap; }
  .line.fee .amt { color: var(--ui-title); }
  .subs { display: grid; gap: 3px; margin: -2px 0 2px 6px; padding-left: 14px; border-left: 2px solid rgba(255,217,138,0.3); }
  .sub { display: flex; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 700; color: var(--colls-ink); }
  .sub::before { content: '\2713'; margin-right: -2px; color: var(--ui-title); font-weight: 900; }
  .sub .dots { flex: 1; border-bottom: 1px dotted rgba(255,246,228,0.2); transform: translateY(-4px); }
  .sub .amt { font-variant-numeric: tabular-nums; color: #7fe0a0; white-space: nowrap; }
  .sub:first-child .amt { color: var(--ui-title); }
  .line.total { margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(196,160,92,0.35); font-size: 20px; font-weight: 800; }
  .line.total .amt { color: var(--ui-title); }
  .odds { display: grid; gap: 6px; font-family: var(--font-body); }
  .odds h4 { margin: 0; font: 900 13px var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--colls-gold); }
  /* The odds bar: one slice per rarity, its percent printed inside; hover a slice for the detail */
  .bars { display: flex; gap: 2px; height: 34px; padding: 2px; border-radius: 10px; background: rgba(0,0,0,0.5); box-shadow: inset 0 0 0 1px rgba(196,160,92,0.3); }
  .seg { position: relative; display: flex; align-items: center; justify-content: center; min-width: 46px; height: 100%; padding: 0 6px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 100%, #fff 18%), var(--rc) 55%, color-mix(in srgb, var(--rc) 70%, #000));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.25);
    font-family: var(--font-body); font-weight: 900; font-size: 14px; color: #140d24; white-space: nowrap; font-variant-numeric: tabular-nums;
    transition: transform 0.12s ease; }
  .seg:first-child { border-radius: 8px 0 0 8px; } .seg:last-child { border-radius: 0 8px 8px 0; } .seg:only-child { border-radius: 8px; }
  .seg:hover { transform: translateY(-2px); z-index: 5; }
  .seg .stip { position: absolute; left: 50%; bottom: calc(100% + 12px); width: 240px; transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
    transition: opacity 0.14s ease, transform 0.14s ease; padding: 11px 15px 12px; text-align: left; white-space: normal;
    border: 1px solid transparent; border-top-width: 2px; border-radius: 12px; color: var(--ui-text);
    background: var(--ui-sheen) padding-box, var(--ui-plate) padding-box, var(--ui-edge) border-box;
    box-shadow: 0 14px 34px -10px rgba(0,0,0,0.72), var(--ui-bevel), inset 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px var(--ui-ring);
    font-weight: 600; font-size: 15px; line-height: 1.42; }
  .seg:hover .stip { opacity: 1; transform: translate(-50%, 0); }
  .seg:first-child .stip { left: 0; transform: translate(0, 6px); } .seg:first-child:hover .stip { transform: translate(0, 0); }
  .seg:last-child .stip { left: auto; right: 0; transform: translate(0, 6px); } .seg:last-child:hover .stip { transform: translate(0, 0); }
  .stip-t { font-family: var(--font-ui); font-weight: 800; font-size: 17px; }
  .stip-p { color: var(--ui-text); padding-bottom: 7px; margin-bottom: 7px; border-bottom: 1px solid rgba(255,217,138,0.2); }
  .stip-r { display: flex; justify-content: space-between; font-size: 14px; color: var(--ui-muted); }
  .stip-r span:last-child { color: var(--ui-text); font-variant-numeric: tabular-nums; }
  .buywrap { display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: center; }
  .buy { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 92px; padding: 12px 40px; border-radius: 14px; }
  .buy .b1 { font-size: 26px; font-weight: 800; }
  .buy .b2 { font-size: 21px; font-variant-numeric: tabular-nums; color: var(--ui-title); }
  .after { font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--colls-dim); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <button class="gem back" type="button">&#9664; Collection</button>
    <div class="title">Chest Shop</div>
    <div class="spacer"></div>
    <div class="gem wallet"><img class="aeth" src="http://localhost:5230/currency/aether.webp" alt="">1,240 <small>Aether</small></div>
  </div>

  <div class="sec-h"><span>Pick a chest</span><img src="http://localhost:5230/frames/name-divider.webp" alt=""></div>
  <div class="chests" id="chests"></div>

  <div class="lower">
  <section class="panel">
    <div class="panel-h"><span>Focus Chest</span><em>The more categories you select, the cheaper the fee!</em></div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="panel checkout">
    <div class="panel-h"><span>Your chest</span></div>
    <div class="receipt" id="receipt"></div>
    <div class="odds">
      <h4>Odds</h4>
      <div class="bars" id="bars"></div>
    </div>
    <div class="buywrap">
      <button class="gem buy" type="button"><span class="b1">Open Chest</span><span class="b2" id="buyprice"></span></button>
    </div>
  </section>
  </div>
  <div class="note">Mockup: click a chest and the categories. Numbers are the real prices and fee table; "left" counts are made up.</div>
</div>

<script>
const ART = 'http://localhost:5230/';
const BAL = 1240;
const TIERS = [
  { id: 'standard', name: 'Standard', floor: 'common', price: 100, color: '#d6e0ec', body: 'collection/crate_body.webp', lid: 'collection/crate_lid.webp',
    g: { bodySrcW: 1187, spikeX: 594, rimY: 41, lidSrcW: 1158, lidAttachX: 578.5, lidAttachY: 336 } },
  { id: 'rare', name: 'Rare', floor: 'rare', price: 200, color: '#5aa8ff', body: 'collection/chest_rare_body.webp', lid: 'collection/chest_rare_lid.webp',
    g: { bodySrcW: 1677, spikeX: 838.5, rimY: 57, lidSrcW: 1643, lidAttachX: 821.5, lidAttachY: 468 } },
  { id: 'epic', name: 'Epic', floor: 'epic', price: 400, color: '#c07bff', body: 'collection/chest_epic_body.webp', lid: 'collection/chest_epic_lid.webp',
    g: { bodySrcW: 1676, spikeX: 838, rimY: 71, lidSrcW: 1628, lidAttachX: 814, lidAttachY: 476, spikeFront: { x0: 778, y0: 0, x1: 898, y1: 74 } } },
  { id: 'legendary', name: 'Legendary', floor: 'legendary', price: 600, color: '#ffb938', body: 'collection/chest_legendary_body.webp', lid: 'collection/chest_legendary_lid.webp',
    g: { bodySrcW: 1676, spikeX: 838, rimY: 74, lidSrcW: 1586, lidAttachX: 793, lidAttachY: 484 } },
  { id: 'ancient', name: 'Ancient', floor: 'ancient', price: 900, color: '#f4eeff', body: 'collection/chest_ancient_body.webp', lid: 'collection/chest_ancient_lid.webp',
    g: { bodySrcW: 1678, spikeX: 839, rimY: 73, lidSrcW: 1636, lidAttachX: 819, lidAttachY: 484, spikeFront: { x0: 779, y0: 0, x1: 899, y1: 76 } } },
];
const RARS = ['common', 'rare', 'epic', 'legendary', 'ancient'];
const RLABEL = { common: 'Common', rare: 'Rare', epic: 'Epic', legendary: 'Legendary', ancient: 'Ancient' };
const RCOL = { common: '#d6e0ec', rare: '#5aa8ff', epic: '#c07bff', legendary: '#ffb938', ancient: '#8af5ff' };
const ODDS = { common: 35, rare: 31, epic: 22, legendary: 9, ancient: 3 };
const FEE = [100, 60, 40, 25, 15, 10, 5];
const CATS = [
  ['Heroes', 24], ['Minions', 58], ['Card Plates', 19], ['Portrait Frames', 7], ['Attack Animations', 9], ['Emotes', 14], ['Titles', 11],
];

let tier = 'epic';
const ticked = new Set(['Heroes', 'Emotes']);

function load(src) { return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = ART + src; }); }

// Compose body + lid the way chestModel.ts does: the lid's attach point lands on the spike line at the rim.
async function drawChest(canvas, t) {
  const [body, lid] = await Promise.all([load(t.body), load(t.lid)]);
  if (!body || !lid) return;
  const g = t.g, k = body.width / g.bodySrcW, kl = lid.width / g.lidSrcW, rel = k / kl;
  const lidW = lid.width * rel, lidH = lid.height * rel;
  const lx = g.spikeX * k - g.lidAttachX * kl * rel, ly = (g.rimY + 3) * k - g.lidAttachY * kl * rel;
  const top = Math.min(0, ly), W = 840, H = 620;
  const s = Math.min(W / body.width, H / (body.height - top));
  const ox = (W - body.width * s) / 2, oy = H - (body.height - top) * s;
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, W, H);
  c.drawImage(body, ox, oy - top * s, body.width * s, body.height * s);
  c.drawImage(lid, ox + lx * s, oy + (ly - top) * s, lidW * s, lidH * s);
  if (g.spikeFront) { const f = g.spikeFront; c.drawImage(body, f.x0 * k, f.y0 * k, (f.x1 - f.x0) * k, (f.y1 - f.y0) * k, ox + f.x0 * k * s, oy + (f.y0 * k - top) * s, (f.x1 - f.x0) * k * s, (f.y1 - f.y0) * k * s); }
}

const chestsEl = document.getElementById('chests');
for (const t of TIERS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = `chest ${t.id}`; b.dataset.tier = t.id; b.style.setProperty('--tc', t.color);
  const sub = t.floor === 'common' ? 'Any rarity can drop' : `Guarantees ${t.name} or better`;
  const allowed = RARS.slice(RARS.indexOf(t.floor));
  const sum = allowed.reduce((s, r) => s + ODDS[r], 0);
  const rows = allowed.map((r) => `<div class="tip-r"><b style="color:${RCOL[r]}">${RLABEL[r]}</b><span>${Math.round(ODDS[r] / sum * 1000) / 10}%</span></div>`).join('');
  b.innerHTML = `<span class="clip"><span class="rays"></span><span class="flash"></span><span class="csweep"></span></span>` +
    `<span class="pick">&#10003;</span><canvas width="840" height="620"></canvas><span class="tname">${t.name}</span>` +
    `<span class="gem tprice"><img class="aeth" src="${ART}currency/aether.webp" alt="">${t.price}</span>` +
    `<span class="tip"><div class="tip-t">${t.name} Chest</div><div class="tip-g">${sub}</div>${rows}</span>`;
  b.onclick = () => { tier = t.id; render(); popChest(b, TIERS.indexOf(t)); };
  chestsEl.appendChild(b);
  drawChest(b.querySelector('canvas'), t);
}
const catsEl = document.getElementById('cats');
const head = document.createElement('div');
head.className = 'cat cat-head';
head.innerHTML = '<span>Category</span><span>Left to find</span><span></span><span></span>';
catsEl.before(head);
for (const [name, n] of CATS) {
  const row = document.createElement('div');
  row.className = 'cat'; row.dataset.cat = name;
  row.innerHTML = `<span class="nm">${name}</span><span class="left">${n}</span><span class="grow"></span><button type="button" class="gem tog"></button>`;
  row.insertAdjacentHTML('afterbegin', '<span class="sweep"></span>');
  row.querySelector('.tog').onclick = () => {
    const turningOn = !ticked.has(name);
    turningOn ? ticked.add(name) : ticked.delete(name);
    render();
    if (turningOn) pop(row);
  };
  catsEl.appendChild(row);
}

// Picking a chest: the higher the tier, the bigger the moment.
//            Standard Rare  Epic  Legendary Ancient
const RINGS  = [1,       1,    2,    2,        3];
const SPARKS = [6,       10,   18,   28,       42];
const REACH  = [50,      65,   90,   115,      145];
const MOTES  = [0,       0,    6,    10,       16];
const TIER_COLS = [
  ['#ffffff', '#d6e0ec'],
  ['#5aa8ff', '#a9d2ff', '#ffffff'],
  ['#c07bff', '#e2bfff', '#ffffff'],
  ['#ffb938', '#ffe08a', '#fff6d6', '#ffffff'],
  null, // Ancient: every hue
];
function tierColour(L) { const c = TIER_COLS[L]; return c ? c[Math.floor(Math.random() * c.length)] : `hsl(${Math.floor(Math.random() * 360)} 95% 75%)`; }
function popChest(b, L) {
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('pop'), 1100);
  const add = (el) => { el.addEventListener('animationend', () => el.remove()); b.appendChild(el); };
  for (let i = 0; i < RINGS[L]; i++) {
    const r = document.createElement('span'); r.className = 'ringfx';
    r.style.setProperty('--c', L === 4 ? ['#8af5ff', '#ff9bf0', '#f4eeff'][i] : tierColour(L));
    r.style.setProperty('--rs', String(2.2 + L * 0.5 + i * 0.6)); r.style.animationDelay = `${i * 110}ms`; add(r);
  }
  for (let i = 0; i < SPARKS[L]; i++) {
    const a = (i / SPARKS[L]) * Math.PI * 2 + Math.random() * 0.5, d = REACH[L] * (0.6 + Math.random() * 0.6);
    const s = document.createElement('span'); s.className = 'spark';
    s.style.setProperty('--dx', `${Math.cos(a) * d}px`); s.style.setProperty('--dy', `${Math.sin(a) * d * 0.85}px`);
    s.style.setProperty('--c', tierColour(L)); s.style.animationDelay = `${Math.random() * (40 + L * 40)}ms`; add(s);
  }
  for (let i = 0; i < MOTES[L]; i++) {
    const m = document.createElement('span'); m.className = 'mote';
    m.style.left = `${15 + Math.random() * 70}%`; m.style.setProperty('--c', tierColour(L));
    m.style.animationDelay = `${120 + Math.random() * 500}ms`; add(m);
  }
}

// One-shot celebration when a category switches ON.
function pop(row) {
  row.classList.remove('pop'); void row.offsetWidth; row.classList.add('pop');
  clearTimeout(row._t); row._t = setTimeout(() => row.classList.remove('pop'), 800);
  const tog = row.querySelector('.tog');
  const cols = ['#fff1c4', '#ffd98a', '#ffb938', '#ffffff'];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + Math.random() * 0.4, d = 46 + Math.random() * 34;
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.setProperty('--dx', `${Math.cos(a) * d * 1.5}px`);
    s.style.setProperty('--dy', `${Math.sin(a) * d}px`);
    s.style.setProperty('--c', cols[i % cols.length]);
    s.style.animationDelay = `${Math.random() * 60}ms`;
    s.addEventListener('animationend', () => s.remove());
    tog.appendChild(s);
  }
}

function render() {
  const t = TIERS.find((x) => x.id === tier);
  for (const el of chestsEl.children) el.classList.toggle('on', el.dataset.tier === tier);
  for (const el of catsEl.children) {
    const on = ticked.has(el.dataset.cat);
    el.classList.toggle('on', on);
    const tg = el.querySelector('.tog');
    for (const n of [...tg.childNodes]) if (!(n.classList && n.classList.contains('spark'))) n.remove();
    tg.insertAdjacentHTML('afterbegin', on ? '<span class="ck">&#10003;</span>On' : 'Off');
  }
  const n = ticked.size, all = n === CATS.length;
  const pct = n === 0 || all ? 0 : FEE[Math.min(n, 7) - 1];
  const fee = Math.round(t.price * pct / 100);
  const total = t.price + fee;
  const ic = `<img class="aeth" src="${ART}currency/aether.webp" alt="">`;
  const names = [...ticked];
  let focusLine = '';
  if (n > 0) {
    // "Focusing" shows the full cost of focusing (one category); every category after the first takes a discount off it,
    // the step down the fee table. Turning on every category discounts it all the way to 0 (no focus, free).
    const feeAt = (k) => (k >= CATS.length ? 0 : Math.round(t.price * FEE[Math.min(k, 7) - 1] / 100));
    const ordered = CATS.map(([c]) => c).filter((c) => ticked.has(c));
    const rows = ordered.map((c, i) => {
      const off = i === 0 ? 0 : feeAt(i) - feeAt(i + 1);
      return `<div class="sub"><span class="nm2">${c}</span><span class="dots"></span><span class="amt">${i === 0 ? `+${ic}${feeAt(1)}` : `&minus;${ic}${off}`}</span></div>`;
    }).join('');
    focusLine = `<div class="line fee"><span class="what">Focusing</span></div>` +
      `<div class="subs">${rows}</div>`;
  }
  document.getElementById('receipt').innerHTML =
    `<div class="line"><span class="what">${t.name} Chest</span><span class="dots"></span><span class="amt">${ic}${t.price}</span></div>` +
    focusLine +
    `<div class="line total"><span class="what">Total</span><span class="dots"></span><span class="amt">${ic}${total}</span></div>`;
  const allowed = RARS.slice(RARS.indexOf(t.floor));
  const sum = allowed.reduce((s, r) => s + ODDS[r], 0);
  // Made-up split of each category's "left" count by rarity, for the hover detail.
  const RSHARE = { common: 0.35, rare: 0.3, epic: 0.2, legendary: 0.1, ancient: 0.05 };
  const pool = n === 0 || all ? CATS : CATS.filter(([c]) => ticked.has(c));
  document.getElementById('bars').innerHTML = allowed.map((r) => {
    const pct = Math.round(ODDS[r] / sum * 1000) / 10;
    const share = ODDS[r] / sum;
    const label = `${pct}%`;
    const per = pool.map(([c, k]) => [c, Math.max(1, Math.round(k * RSHARE[r]))]);
    const total = per.reduce((s, [, k]) => s + k, 0);
    const rows = per.map(([c, k]) => `<div class="stip-r"><span>${c}</span><span>${k}</span></div>`).join('');
    return `<span class="seg" style="--rc:${RCOL[r]};flex:${ODDS[r]} 1 0">${label}` +
      `<span class="stip"><div class="stip-t" style="color:${RCOL[r]}">${RLABEL[r]} &middot; ${pct}%</div>` +
      `<div class="stip-p">${pct}% chance this chest gives a ${RLABEL[r]}. ${total} ${RLABEL[r]} items left to find:</div>${rows}</span></span>`;
  }).join('');
  document.getElementById('buyprice').innerHTML = `${ic}${total}`;
}
render();
</script>
</body>
</html>
