<script>
const QUESTIONS = [
  {
    topic: "types-basics",
    question: "packages/core/src/types.ts's <code>EffectDef</code> interface has a field written as <code>align?: 'dawn' | 'dusk';</code>. What does the <code>?</code> right after <code>align</code> mean in TypeScript?",
    choices: [
      "This property is required and must be either 'dawn' or 'dusk' — the ? is just documentation",
      "This property is optional — an EffectDef can leave it out entirely, and code that reads it must handle the \"not present\" case",
      "The property can hold any value at all; the ? disables type checking for it",
      "The ? marks align as a private field, hidden from other files"
    ],
    answer: 1,
    explanation: "A <code>?</code> after a property name marks it optional — the object is valid whether or not that key is present, and TypeScript flags any code that reads <code>effect.align</code> as if it were always a string without also handling <code>undefined</code>. That's exactly the intent here: an ungated effect just omits the field, and <code>alignAllows()</code> (right below it in types.ts) treats \"no align\" as \"always fires.\" Required fields never carry a ?, so option A is backwards; ? isn't the same as <code>any</code> (option C), and TypeScript uses <code>private</code>/<code>#</code> for privacy, not ? (option D)."
  },
  {
    topic: "immutability",
    question: "packages/sim/src/reducer.ts's <code>conjurePlainCopy</code> helper builds a new hand card with <code>keywords: [...def.keywords]</code> instead of the shorter <code>keywords: def.keywords</code>. Given CLAUDE.md's rule \"never mutate shared CardDefs,\" why spread the array into a copy instead of assigning it directly?",
    choices: [
      "<code>[...def.keywords]</code> simply runs faster than a direct assignment",
      "Assigning def.keywords directly already copies the array by value in JavaScript, so the spread is only for readability",
      "Assigning def.keywords directly would make the new hand card's keywords point at the SAME array living on the shared CardDef — later changing the hand card's keywords would silently corrupt every other copy of that card too. The spread creates a brand-new array instead",
      "TypeScript requires every array to be spread before it can be assigned to another object's property"
    ],
    answer: 2,
    explanation: "JavaScript arrays are assigned BY REFERENCE, not by value — <code>keywords: def.keywords</code> would hand the new hand card a pointer to the exact same array object the shared <code>CardDef</code> uses. Push or remove a keyword on that hand card later, and you'd be silently mutating the one CardDef every other copy of that card also reads — precisely the bug CLAUDE.md's rule exists to prevent. <code>[...def.keywords]</code> copies each element into a fresh array so the hand card owns its own independent list. Option B has it backwards: JS does NOT auto-copy arrays on assignment — that's the whole reason this line needs to exist."
  },
  {
    topic: "reducer-run-state",
    question: "reducer.ts's Food-for-Gold payoff inside spendGold is written with a while loop: <code>s.foodForGoldTick += amount; while (s.foodForGoldTick >= s.foodForGold.per) { s.foodForGoldTick -= s.foodForGold.per; /* grant a Fodder */ }</code>. Mike spends 45 Gold in one purchase and <code>per</code> is 20. What does the while loop guarantee here that a single <code>if (tick >= per) { ... }</code> check would miss?",
    choices: [
      "Nothing — a while loop and a single if produce exactly the same result in every case",
      "The while loop correctly fires the Fodder grant TWICE (for the two full 20s inside 45) and leaves exactly 5 banked toward the next threshold; a single if could only ever fire once, undercounting a big spend",
      "The while loop exists purely to slow the game down for balance reasons",
      "The while loop resets foodForGoldTick to 0 on every payout, discarding any leftover progress"
    ],
    answer: 1,
    explanation: "A single purchase or reroll can spend an amount bigger than one whole threshold — 45 crosses 20 twice. An <code>if</code> can only ever run its body once, no matter how large <code>amount</code> is, so a big spend would silently undercount. The <code>while</code> keeps subtracting <code>per</code> and re-checking, firing once for every full threshold actually crossed, and stops with exactly the leftover (5) still sitting in <code>foodForGoldTick</code> for next time — it does NOT reset to 0 (ruling out option D), it subtracts <code>per</code> each pass, preserving the remainder."
  },
  {
    topic: "zustand-store",
    question: "packages/ui/src/store.ts has this near the top of the file, executed directly in the module's body — not inside any function: <code>if (OPPONENT_POOL.length === 0) registerOpponents([...OPPONENT_POOL_DATA]);</code>. What's the practical effect of writing this at the TOP LEVEL of the module instead of, say, inside a <code>startApp()</code> function that something else has to remember to call?",
    choices: [
      "It never runs at all — top-level statements in a module are dead code",
      "It runs automatically, once, the moment this module is first imported — no caller required — and the length check keeps it from double-registering if the module body is ever evaluated again",
      "It re-runs on every single React render, exactly like code inside a component",
      "It only runs in test files, never in the real browser build"
    ],
    answer: 1,
    explanation: "JS/ES modules execute their top-level statements once, the first time the module is imported — that's how store.ts seeds its default opponent pool without any UI code having to remember to call an init function. The <code>if (OPPONENT_POOL.length === 0)</code> guard exists because a module's body can, in rare bundling/HMR situations, be evaluated more than once, and registering the same boards twice would be wasteful — the guard makes it idempotent. It is NOT component code (ruling out option C): this runs once at import time, never per-render, which is exactly why it lives outside any component."
  },
  {
    topic: "event-bus",
    question: "CombatBus.on(event, handler) in packages/core/src/events.ts reads: <code>const list = this.handlers.get(event); if (list) list.push(handler); else this.handlers.set(event, [handler]);</code>. What is <code>this.handlers</code> here, and what is on() actually doing?",
    choices: [
      "this.handlers is one single array of every handler ever registered for any event; on() just appends to it",
      "this.handlers is a Map from each event name to an ARRAY of handlers for that event; on() looks up (or creates) that event's list and adds the new handler to it — so many minions can all subscribe to the same event",
      "this.handlers stores exactly ONE handler per event; on() overwrites whichever handler was registered before",
      "on() removes any previously registered handler for that event before adding the new one"
    ],
    answer: 1,
    explanation: "<code>handlers: Map&lt;GameEvent, EventHandler[]&gt;</code> means each event key maps to a LIST of handlers, not a single one — that's what lets five different minions on the board each subscribe their own onAttack handler to the same 'onAttack' event without stepping on one another. on() reads the existing list for that event if one already exists (some earlier minion already subscribed) or creates a brand-new one-element list on the Map if this is the first subscriber. Options C and D describe an overwrite-style single-handler design, which would break combat the instant two minions cared about the same event."
  },
  {
    topic: "cards-in-sets",
    question: "packages/content/src/sets.ts builds a dropped-spells list as <code>const SET2_DROPPED_SPELLS = new Set&lt;string&gt;(['lanternofsouls', 'undeadarmy', 'consume', 'foddertreatment']);</code>, later checked with <code>.has(id)</code>. Why use a JS <code>Set</code> here instead of a plain array checked with <code>.includes(id)</code>?",
    choices: [
      "A Set preserves insertion order, and an array does not",
      "A Set can hold duplicate values, which is useful here",
      "A Set's .has() lookup is built for fast membership checks and doesn't need to scan every element the way .includes() does on an array — exactly the job \"is this id in the dropped list?\" needs",
      "Plain arrays in JavaScript can't hold string values, only Sets can"
    ],
    answer: 2,
    explanation: "A <code>Set</code> is a data structure purpose-built for \"is this value in here?\" checks — <code>.has()</code> doesn't have to walk the whole collection the way <code>.includes()</code> on an array does. For a four-item list it barely matters performance-wise, but it's also a signal to a reader: this collection's job is membership testing, not order or iteration. Option A is beside the point (arrays and Sets both preserve insertion order in JS, but that's not why this one is used); option B is exactly backwards — Sets specifically CANNOT hold duplicate values; option D is simply false."
  },
  {
    topic: "package-boundaries",
    question: "CLAUDE.md's ownership map splits the codebase cleanly along the sim/presentation seam — Kevin owns core + content + sim, Mike owns ui — but it calls out <code>packages/core/src/types.ts</code> specifically as a \"Shared boundary (coordinate before changing).\" Why would ONE types file need that special callout when everything else is split cleanly by package?",
    choices: [
      "types.ts is the only file in the whole repo with any syntax errors",
      "Every package — core, content, sim, AND ui — reads shared definitions out of types.ts, like the CombatEvent union, so a change there can silently break code in a package neither person was \"in\" when they made the change, unlike a change confined to one owned package",
      "types.ts is actually UI-only code that was mistakenly placed inside packages/core",
      "It's called out only because it's the longest file in the repo, so it simply takes the longest to review"
    ],
    answer: 1,
    explanation: "The ownership split works because most files are read and written by only one side of the sim/UI boundary — but types.ts defines shared vocabulary (like the <code>CombatEvent</code> union) that BOTH the engine, which produces those events, and the UI, which reads and animates them, depend on. Changing a shared type can break the other person's code even though they never touched the file that changed — which is exactly why CLAUDE.md singles types.ts out as something to coordinate on, rather than trusting the ownership split to prevent collisions automatically."
  },
  {
    topic: "effects-as-subscriptions",
    question: "types.ts's <code>EffectDef</code> interface is <code>{ on: GameEvent; do: EffectFactoryId; params?: Record&lt;string, unknown&gt;; align?: ... }</code>. Given CLAUDE.md's rule that cards are \"data + effect subscriptions, never bespoke classes,\" what is <code>params</code> actually for?",
    choices: [
      "It stores the card's flavor text, for display in the UI",
      "It's a generic bag of card-specific configuration — a damage amount, a count, a tribe to target — handed to the SAME shared factory function named in do, so one factory (like 'scDamage') can behave differently for different cards without each card needing its own function",
      "It's dead legacy code left over from an earlier version of the engine",
      "It stores the RNG seed used specifically for that one effect"
    ],
    answer: 1,
    explanation: "This is the crux of \"data, not classes\": instead of writing a brand-new function for every card's Start-of-Combat damage number, ONE <code>scDamage</code> factory reads whatever numbers a given card supplies in <code>params</code> (say, <code>{ amount: 3 }</code>) and applies them generically. A card's whole effect is fully described by three plain-data fields — <code>on</code>, <code>do</code>, <code>params</code> — with no code of its own, which is exactly what lets a brand-new card ship as a pure data file instead of a new TypeScript class or function."
  },
  {
    topic: "effect-timing-pipeline",
    question: "types.ts's giant EffectFactoryId union has comments splitting it into zones — <code>// combat-time (resolved inside simulate)</code> near the top, then later <code>// recruit-time (resolved by @game/sim, baked into stats before combat)</code> — but the TYPE ITSELF is one flat union of string literals with no structural difference between the two zones. What actually enforces that a combat-time id like 'scDamage' only ever runs during simulate(), and a recruit-time id like 'battlecryBuffTribe' only ever runs during the shop phase?",
    choices: [
      "TypeScript itself enforces it — using a combat-time id in recruit-phase code is a compile error",
      "Nothing enforces it; either kind of id can run interchangeably in either phase",
      "The comments are purely organizational notes for humans scanning the list; the real enforcement lives in the CODE that reads each do value — the combat simulator only knows how to dispatch combat-time ids, and the recruit-phase code only knows how to dispatch recruit-time ones. A card using the wrong id for its phase would simply never fire, not fail to compile",
      "A dedicated ESLint rule blocks recruit-time ids from being imported into the combat simulator"
    ],
    answer: 2,
    explanation: "<code>EffectFactoryId</code> is one flat union of strings — TypeScript only guarantees the string is ONE of the ~300 listed ids; it says nothing about WHEN that id is allowed to run. The comment split is there purely for humans scanning the list. What actually keeps combat-time and recruit-time effects in their lanes is that the simulator's dispatch code only recognizes combat-time factory ids, and the recruit-phase code (@game/sim) only recognizes recruit-time ones — so a misplaced id doesn't crash the build, it just silently does nothing at runtime. That's exactly why CLAUDE.md's \"read the real code, don't infer from a symbol alone\" habit matters so much here."
  },
  {
    topic: "testing-vitest",
    question: "packages/core/src/rng.test.ts's first test is roughly: <code>const a = makeRng(42); const b = makeRng(42); const seqA = Array.from({length:16}, () =&gt; a.next()); const seqB = ...; expect(seqA).toEqual(seqB);</code> — it compares two freshly-generated sequences to EACH OTHER, not to one fixed array of hardcoded numbers written into the test. What does this test actually prove, and what does it NOT prove?",
    choices: [
      "It proves the RNG's numbers are cryptographically secure; it says nothing about performance",
      "It proves that the same seed always reproduces the same sequence — determinism, the exact guarantee replays and shared seeds depend on. It does NOT prove the numbers are statistically \"good\" or match some known-correct reference sequence: a badly broken RNG that always returned 0 would pass this exact test too",
      "It proves the numbers are uniformly distributed between 0 and 1",
      "It proves fork() works correctly, since forking is used internally by makeRng()"
    ],
    answer: 1,
    explanation: "Comparing two live-generated sequences against each other, rather than against a fixed golden array, isolates exactly ONE property: reproducibility — same seed in, same sequence out. That's a great test for that one thing, but it's deliberately weak evidence of anything else: an RNG that always returned <code>0</code> would produce <code>seqA</code> and <code>seqB</code> both equal to <code>[0,0,0,...]</code> and pass this test just fine. That's why rng.test.ts also has separate, narrowly-scoped tests for \"floats stay in [0, 1)\" and \"diverges for different seeds\" — each test proves one specific property, not \"the RNG is correct\" as a whole."
  }
];

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreCounter = document.getElementById('scoreCounter');

function render() {
  if (current >= QUESTIONS.length) {
    renderSummary();
    return;
  }
  const q = QUESTIONS[current];
  answered = false;
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
  qCounter.textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;

  const letters = ['A', 'B', 'C', 'D'];
  quizArea.innerHTML = `
    <div class="card">
      <span class="qtag">${q.topic}</span>
      <p class="qtext">${q.question}</p>
      <div class="choices" id="choicesWrap">
        ${q.choices.map((c, i) => `
          <button class="choice" data-idx="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${c}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="nextbtn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'See results →' : 'Next question →'}</button>
    </div>
  `;

  const buttons = quizArea.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const correct = idx === q.answer;
      if (correct) score++;
      buttons.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.getAttribute('data-idx'), 10);
        if (bi === q.answer) b.classList.add('correct');
        else if (bi === idx) b.classList.add('wrong');
      });
      const explainBox = document.getElementById('explainBox');
      explainBox.innerHTML = (correct ? '✅ <strong>Correct!</strong> ' : '❌ <strong>Not quite.</strong> ') + q.explanation;
      explainBox.classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
      scoreCounter.textContent = `Score: ${score}`;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    render();
  });
}

function renderSummary() {
  progressFill.style.width = '100%';
  qCounter.textContent = `Question ${QUESTIONS.length} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let line;
  if (pct === 100) line = "Perfect score! You're reading this codebase like you wrote it.";
  else if (pct >= 80) line = "Great work — you're building real intuition for how this all fits together.";
  else if (pct >= 50) line = "Solid effort — a few concepts to revisit, and it'll click more each day.";
  else line = "Everyone starts somewhere — re-read the explanations above, tomorrow's quiz will circle back.";

  quizArea.innerHTML = `
    <div class="card summary">
      <div class="line">Quiz complete</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="line">${pct}%</div>
      <div class="encourage">${line}</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
