<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pack opening - rough mockup</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none;
    background: radial-gradient(ellipse at 50% 42%, #1d2444 0%, #0a0c17 62%, #05060b 100%);
    color: #ece6d2; font-family: "Segoe UI", system-ui, sans-serif; }
  #bar { position: fixed; top: 14px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; z-index: 100; }
  #bar button { background: #1a1f33; color: #e8dfc0; border: 1px solid #4a4f6a; border-radius: 8px; padding: 8px 14px;
    font: 600 13px "Segoe UI", sans-serif; letter-spacing: .04em; }
  #bar button.on { border-color: #e8c66a; color: #fff3c8; background: #2b2a2a; }
  #note { position: fixed; top: 56px; width: 100%; text-align: center; font-size: 12px; color: #8a8fa8; z-index: 100; }
  #hint { position: fixed; bottom: 26px; width: 100%; text-align: center; font-size: 15px; letter-spacing: .14em;
    text-transform: uppercase; color: #e8d9a8; z-index: 100; text-shadow: 0 2px 8px #000; }

  #scene { position: absolute; left: 50%; top: 52%; width: 0; height: 0; perspective: 1500px; }

  /* ---------- the pack ---------- */
  .pk { position: absolute; left: -130px; width: 260px; }
  .pack-back { top: -190px; height: 380px; z-index: 1; border-radius: 12px;
    background: linear-gradient(160deg, var(--f2), var(--f1)); filter: brightness(.45); }
  .sleeve { top: -140px; height: 330px; z-index: 30; border-radius: 0 0 12px 12px; cursor: grab;
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 58%),
      linear-gradient(160deg, var(--f1), var(--f2) 55%, var(--f3));
    box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .sleeve .brand { font: 800 15px Georgia, serif; letter-spacing: .5em; opacity: .8; margin-bottom: 18px; }
  .sleeve .pname { font: 800 30px Georgia, serif; letter-spacing: .06em; line-height: 1.05; padding: 0 16px;
    text-shadow: 0 3px 10px rgba(0,0,0,.6); }
  .sleeve .sub { margin-top: 18px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .sleeve .emblem { font-size: 54px; margin-bottom: 14px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }

  .strip { top: -190px; height: 50px; z-index: 31; cursor: ew-resize; }
  .strip .rem, .strip .peel { position: absolute; inset: 0; border-radius: 12px 12px 0 0;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 3px, transparent 3px 7px) top / 100% 9px no-repeat,
      linear-gradient(160deg, var(--f1), var(--f2)); }
  .strip .rem::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px;
    border-bottom: 2px dashed rgba(255,255,255,.55); }
  .strip .peel { box-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .strip .peel.flyoff { transition: transform .5s cubic-bezier(.3,.0,.8,.4), opacity .5s; opacity: 0; }
  .tearhint { position: absolute; top: 12px; left: 10px; font-size: 18px; color: #fff; opacity: .9;
    animation: nudge 1.1s ease-in-out infinite; pointer-events: none; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(16px); } }

  .slide-off { transition: transform .5s cubic-bezier(.5,0,.9,.5), opacity .5s .2s; opacity: 0; }
  .snap { transition: transform .25s cubic-bezier(.2,.9,.3,1.2); }

  /* ---------- the cards ---------- */
  .card { position: absolute; left: 0; top: 0; width: 200px; height: 290px; transform-style: preserve-3d;
    transition: transform .72s cubic-bezier(.2,.8,.2,1); }
  .card.zooming { transition: transform .65s cubic-bezier(.3,1.45,.5,1); }
  .lift { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .18s ease-out; }
  .card.top { cursor: pointer; }
  .card.top:hover .lift { transform: translateY(-10px); }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 3px solid var(--rc); box-shadow: 0 14px 30px rgba(0,0,0,.55); overflow: hidden; }
  .back { background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px),
      radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 60%, #000) 0%, #0b0d16 72%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: visible; }
  .back .glow { position: absolute; inset: -12px; border-radius: 22px; box-shadow: 0 0 44px 12px var(--rc);
    opacity: .28; pointer-events: none; z-index: -1; }
  .back.hi .glow { animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .25; } to { opacity: .95; } }
  .back .emb { font-size: 64px; color: var(--rc); text-shadow: 0 0 18px var(--rc); }
  .back .gems { margin-top: 10px; letter-spacing: 6px; color: var(--rc); font-size: 14px; }
  .back .rib { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font: 700 11px "Segoe UI";
    letter-spacing: .2em; color: #111; background: var(--rc); padding: 4px 0; }

  .front { transform: rotateY(180deg); background: linear-gradient(180deg, #1b1f30, #0e1019);
    display: flex; flex-direction: column; align-items: center; }
  .front .cat { margin-top: 12px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #aab; }
  .front .art { margin: 12px 0 8px; width: 160px; height: 140px; border-radius: 10px; display: grid; place-items: center;
    font-size: 70px; background: radial-gradient(circle, color-mix(in srgb, var(--rc) 45%, transparent), transparent 70%); }
  .front .nm { font: 700 18px Georgia, serif; text-align: center; padding: 0 10px; }
  .front .rl { margin-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--rc); }
  .front .new { position: absolute; top: 8px; right: 8px; font: 800 11px "Segoe UI"; background: #3ddc84; color: #062;
    padding: 2px 7px; border-radius: 6px; }
  .front .dupe { position: absolute; top: 112px; left: 10px; right: 10px; text-align: center; font: 900 24px "Segoe UI";
    letter-spacing: .12em; color: #ffdf8a; border: 3px solid #ffdf8a; border-radius: 8px; background: rgba(20,14,0,.75);
    transform: rotate(-12deg) scale(1.8); opacity: 0; }
  .front .aeth { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font: 800 14px "Segoe UI";
    color: #9fe8ff; opacity: 0; transform: translateY(10px); }
  .card.revealed .dupe { animation: stamp .3s .8s cubic-bezier(.3,1.6,.6,1) forwards; }
  .card.revealed .aeth { animation: rise .4s 1.2s ease-out forwards; }
  .card.revealed.isdupe .art, .card.revealed.isdupe .nm { animation: dim .5s 1.1s forwards; }
  @keyframes stamp { to { opacity: 1; transform: rotate(-12deg) scale(1); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes dim { to { opacity: .35; } }
</style>
</head>
<body>
<div id="bar">
  <button data-pack="standard">Standard Pack</button>
  <button data-pack="legendary">Legendary Pack</button>
  <button data-pack="plushie">Plushie Beasts Pack</button>
  <button data-pack="emotes">Emote Pack</button>
  <button id="reset">Reset</button>
</div>
<div id="note">Rough mockup: feel and sequence only. Real build is Pixi with real art, sound and FX.</div>
<div id="scene"></div>
<div id="hint"></div>

<script>
const RC = { common: '#a3abb5', rare: '#3f8cff', epic: '#b062ff', legendary: '#ffa63a', ancient: '#33e6c4' };
const RANK = { common: 1, rare: 2, epic: 3, legendary: 4, ancient: 5 };
const LABEL = { common: 'Common', rare: 'Rare', epic: 'Epic', legendary: 'Legendary', ancient: 'Ancient' };

const PACKS = {
  standard: { name: 'STANDARD PACK', icon: '✦', g: 'Rare', f1: '#3a4f7a', f2: '#1d2a48', f3: '#5c7bb0', cards: [
    { r: 'common', cat: 'Title', name: 'Tavern Regular', icon: '\u{1F4DC}' },
    { r: 'rare', cat: 'Emote', name: 'Smug Grin', icon: '\u{1F60F}', dupe: 25 },
    { r: 'common', cat: 'Board', name: 'Mossy Glade', icon: '\u{1F33F}' },
    { r: 'common', cat: 'Portrait Frame', name: 'Glass Shard', icon: '\u{1F4A0}', dupe: 10 },
    { r: 'epic', cat: 'Minion Skin', name: 'Scribbled Bob', icon: '✏️', g: true },
  ]},
  legendary: { name: 'LEGENDARY PACK', icon: '\u{1F451}', g: 'Legendary', f1: '#b07a1e', f2: '#5a3a08', f3: '#f1c75a', cards: [
    { r: 'common', cat: 'Card Plate', name: 'Oak Plate', icon: '\u{1FAB5}' },
    { r: 'rare', cat: 'Title', name: 'Pocket Mage', icon: '\u{1F4DC}' },
    { r: 'common', cat: 'Emote', name: 'Shrug', icon: '\u{1F937}', dupe: 10 },
    { r: 'epic', cat: 'Hero Attack', name: 'Arcane Volley', icon: '✨' },
    { r: 'ancient', cat: 'Hero Skin', name: 'Lord of Death', icon: '\u{1F480}', g: true },
  ]},
  plushie: { name: 'PLUSHIE BEASTS', icon: '\u{1F9F8}', g: 'Rare', f1: '#d06a9e', f2: '#7a2f5c', f3: '#ffb3d6', cards: [
    { r: 'common', cat: 'Minion Skin', name: 'Plushie Armadiyo', icon: '\u{1F994}' },
    { r: 'rare', cat: 'Minion Skin', name: 'Plushie Packstrider', icon: '\u{1F43A}' },
    { r: 'common', cat: 'Minion Skin', name: 'Plushie Scalefeather', icon: '\u{1F985}', dupe: 10 },
    { r: 'rare', cat: 'Minion Skin', name: 'Plushie Bramblehog', icon: '\u{1F417}' },
    { r: 'legendary', cat: 'Card Plate', name: 'Plushie Plate', icon: '\u{1F9F5}', g: true },
  ]},
  emotes: { name: 'EMOTE PACK', icon: '\u{1F604}', g: 'Rare', f1: '#2f8a6a', f2: '#123f33', f3: '#6fe0b4', cards: [
    { r: 'common', cat: 'Emote', name: 'Thumbs Up', icon: '\u{1F44D}' },
    { r: 'common', cat: 'Emote', name: 'Facepalm', icon: '\u{1F926}' },
    { r: 'rare', cat: 'Emote', name: 'Smug Grin', icon: '\u{1F60F}', dupe: 25 },
    { r: 'common', cat: 'Emote', name: 'Popcorn', icon: '\u{1F37F}' },
    { r: 'epic', cat: 'Emote', name: 'Table Flip', icon: '\u{1F92F}', g: true },
  ]},
};

const scene = document.getElementById('scene');
const hint = document.getElementById('hint');
let P, cards, back, sleeve, strip, rem, peel, tearhint, phase, prog, zoomed, done, nextOrder, drag;

function el(cls, html) { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; }
function setHint(t) { hint.textContent = t; }

function makeCard(c, i) {
  const n = RANK[c.r];
  const e = el('card');
  e.style.setProperty('--rc', RC[c.r]);
  e.innerHTML = `<div class="lift">
    <div class="face back ${n >= 4 ? 'hi' : ''}"><div class="glow"></div><div class="emb">◆</div>
      <div class="gems">${'◆'.repeat(n)}</div>${c.g ? `<div class="rib">GUARANTEED ${P.g.toUpperCase()}+</div>` : ''}</div>
    <div class="face front"><div class="cat">${c.cat}</div><div class="art">${c.icon}</div>
      <div class="nm">${c.name}</div><div class="rl">${LABEL[c.r]}</div>
      ${c.dupe ? `<div class="dupe">DUPLICATE</div><div class="aeth">Dismantled: +${c.dupe} Aether</div>` : '<div class="new">NEW</div>'}</div>
  </div>`;
  if (c.dupe) e.classList.add('isdupe');
  const card = { data: c, el: e, state: 'stack', order: 0 };
  e.addEventListener('click', () => flip(card));
  return card;
}

function place(c, x, y, s, r, z) {
  c.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) scale(${s}) rotateY(${r}deg)`;
  c.el.style.zIndex = z;
}

function layout() {
  const stack = cards.filter(c => c.state === 'stack');
  stack.forEach((c, k) => {
    const s = zoomed ? 1.25 : 1;
    place(c, zoomed ? -170 : 0, (zoomed ? -10 : -25) + k * 5 * s, s, 0, 20 - k);
    c.el.classList.toggle('top', phase === 'reveal' && k === 0);
  });
  const rev = cards.filter(c => c.state === 'rev').sort((a, b) => a.order - b.order);
  rev.forEach((c, i) => {
    c.el.classList.remove('top');
    if (done) place(c, (i - 2) * 172, -20, 0.8, 180, 40 + i);
    else if (i === rev.length - 1) place(c, 200, -10, 1.25, 180, 60);
    else place(c, -250 + i * 92, 262, 0.42, 180, 40 + i);
  });
}

function build(key) {
  document.querySelectorAll('#bar button[data-pack]').forEach(b => b.classList.toggle('on', b.dataset.pack === key));
  P = PACKS[key];
  scene.style.setProperty('--f1', P.f1); scene.style.setProperty('--f2', P.f2); scene.style.setProperty('--f3', P.f3);
  scene.innerHTML = '';
  phase = 'peel'; prog = 0; zoomed = false; done = false; nextOrder = 0; drag = null;
  back = el('pk pack-back');
  sleeve = el('pk sleeve', `<div class="brand">ASCENT</div><div class="emblem">${P.icon}</div><div class="pname">${P.name}</div>
    <div class="sub">5 cards · 1 guaranteed ${P.g}+</div>`);
  strip = el('pk strip'); rem = el('rem'); peel = el('peel'); tearhint = el('tearhint', '→');
  strip.append(rem, peel, tearhint);
  cards = P.cards.map(makeCard);
  scene.append(back, ...cards.map(c => c.el), sleeve, strip);
  renderPeel();
  layout();
  setHint('Drag across the top to tear it open');
}

function renderPeel() {
  const pct = prog * 100;
  rem.style.clipPath = `inset(0 0 0 ${pct}%)`;
  peel.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
  peel.style.transformOrigin = `${pct}% 100%`;
  peel.style.transform = `translateY(${-prog * 14}px) rotate(${-prog * 16}deg)`;
  tearhint.style.display = prog > 0 ? 'none' : '';
}

// ---------- input ----------
window.addEventListener('pointerdown', (e) => {
  if (phase === 'peel' && strip.contains(e.target)) {
    const r = strip.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width;
    if (prog === 0 && fx > 0.3) { setHint('Start the tear from the left corner'); return; }
    drag = { kind: 'peel', r };
  } else if (phase === 'sleeve' && sleeve.contains(e.target)) {
    drag = { kind: 'sleeve', y0: e.clientY, dy: 0 };
    sleeve.classList.remove('snap'); back.classList.remove('snap');
    sleeve.style.cursor = 'grabbing';
  }
});

window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (drag.kind === 'peel') {
    const fx = Math.min(1, Math.max(0, (e.clientX - drag.r.left) / drag.r.width));
    if (fx > prog) { prog = fx; renderPeel(); }
    if (prog >= 0.92) finishPeel();
  } else if (drag.kind === 'sleeve') {
    drag.dy = Math.max(0, e.clientY - drag.y0);
    // resistance: the first 40px is stiff, then it gives
    const d = drag.dy < 40 ? drag.dy * 0.4 : 16 + (drag.dy - 40);
    sleeve.style.transform = back.style.transform = `translateY(${d}px)`;
  }
});

window.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.kind === 'sleeve') {
    sleeve.style.cursor = '';
    if (drag.dy > 170) finishSleeve();
    else { sleeve.classList.add('snap'); back.classList.add('snap'); sleeve.style.transform = back.style.transform = ''; }
  }
  drag = null;
});

function finishPeel() {
  drag = null; phase = 'busy'; prog = 1; renderPeel();
  peel.classList.add('flyoff');
  peel.style.transform = 'translate(190px,-240px) rotate(38deg)';
  rem.style.display = 'none';
  setTimeout(() => { phase = 'sleeve'; setHint('Pull the sleeve down'); }, 350);
}

function finishSleeve() {
  phase = 'busy';
  sleeve.classList.add('slide-off'); back.classList.add('slide-off');
  sleeve.style.transform = back.style.transform = 'translateY(110vh)';
  setHint('');
  setTimeout(() => {
    zoomed = true;
    cards.forEach(c => c.el.classList.add('zooming'));
    phase = 'reveal'; layout();
    setTimeout(() => cards.forEach(c => c.el.classList.remove('zooming')), 700);
    setHint('Click the top card to flip it');
  }, 380);
}

function flip(c) {
  if (phase !== 'reveal') return;
  const top = cards.filter(x => x.state === 'stack')[0];
  if (c !== top) return;
  c.state = 'rev'; c.order = nextOrder++; c.el.classList.add('revealed');
  layout();
  const left = cards.filter(x => x.state === 'stack').length;
  if (left === 0) {
    phase = 'busy';
    const aether = cards.reduce((s, x) => s + (x.data.dupe || 0), 0);
    setTimeout(() => {
      done = true; layout();
      setHint(aether ? `Pack complete · duplicates dismantled for +${aether} Aether` : 'Pack complete');
    }, 1900);
  } else {
    setHint(left === 1 ? 'Last card: the guaranteed one' : 'Click the top card to flip it');
  }
}

document.querySelectorAll('#bar button[data-pack]').forEach(b => b.addEventListener('click', () => build(b.dataset.pack)));
document.getElementById('reset').addEventListener('click', () => build(document.querySelector('#bar button.on').dataset.pack));
build('standard');
</script>
</body>
</html>
