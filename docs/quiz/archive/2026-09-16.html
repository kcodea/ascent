      choices: [
        "<code>patch</code> is ordinary module-level mutable state (not React/Zustand-managed) that every test in the file can read and write — without resetting it before each test, an earlier test's leftover binding overrides would silently carry into the next test, making results depend on test ORDER",
        "<code>beforeEach</code> is boilerplate every vitest file is required to include — omitting it wouldn't change what any test actually does",
        "<code>resetBindings()</code> actually clears a DIFFERENT global (the seeded combat RNG), so it's unrelated to what <code>bindings.test.ts</code> is testing",
        "Since JavaScript modules are re-imported fresh for every single <code>it()</code>, <code>patch</code> already starts empty each test regardless — <code>resetBindings()</code> is a defensive no-op"
      ],
      answer: 0,
      explanation: "Modules are NOT re-imported per test — a module's top-level state, like <code>bindings.ts</code>'s <code>patch</code> object, is created ONCE per test file and stays alive across every <code>it()</code> inside it. If one test called <code>setBinding(...)</code> and the next test didn't reset first, the second test would see the first test's leftover override — a classic source of tests that pass individually but fail (or pass for the wrong reason) depending on run order. <code>beforeEach(() =&gt; resetBindings())</code> forces every test to start from the same clean slate. <code>beforeEach</code> is an ordinary vitest hook that only runs when explicitly called, not required boilerplate, and <code>resetBindings()</code> clears <code>bindings.ts</code>'s own <code>patch</code>/<code>localStorage</code> state — nothing RNG-related. See packages/ui/src/choreo/bindings.ts:384 and packages/ui/src/choreo/bindings.test.ts."
    }
  ];

  var idx = 0, score = 0, answered = false;
  var results = [];

  var topicLabels = {
    "types-basics": "TypeScript types",
    "immutability": "Immutability",
    "reducer-run-state": "Reducer + run state",
    "zustand-store": "Zustand store",
    "event-bus": "Event bus",
    "cards-in-sets": "Cards in sets",
    "package-boundaries": "Package boundaries",
    "effects-as-subscriptions": "Effects as subscriptions",
    "effect-timing-pipeline": "Effect timing",
    "testing-vitest": "Testing (vitest)"
  };

  var fill = document.getElementById("fill");
  var progLabel = document.getElementById("progLabel");
  var topicTag = document.getElementById("topicTag");
  var qtext = document.getElementById("qtext");
  var choicesEl = document.getElementById("choices");
  var explainEl = document.getElementById("explain");
  var scoreLabel = document.getElementById("scoreLabel");
  var nextBtn = document.getElementById("nextBtn");
  var quizBody = document.getElementById("quizBody");
  var finalEl = document.getElementById("final");
  var finalScore = document.getElementById("finalScore");
  var finalLine = document.getElementById("finalLine");
  var finalBits = document.getElementById("finalBits");

  var letters = ["A", "B", "C", "D"];

  function render() {
    var q = QUESTIONS[idx];
    answered = false;
    fill.style.width = (idx / QUESTIONS.length * 100) + "%";
    progLabel.textContent = (idx + 1) + " / " + QUESTIONS.length;
    topicTag.textContent = topicLabels[q.topicId] || q.topicId;
    qtext.innerHTML = q.question;
    scoreLabel.textContent = "Score: " + score + " / " + QUESTIONS.length;
    explainEl.className = "explain";
    explainEl.innerHTML = "";
    nextBtn.className = "next";
    choicesEl.innerHTML = "";

    q.choices.forEach(function (choiceText, i) {
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + choiceText + '</span>';
      btn.addEventListener("click", function () { pick(i, btn); });
      choicesEl.appendChild(btn);
    });
  }

  function pick(i, btn) {
    if (answered) return;
    answered = true;
    var q = QUESTIONS[idx];
    var correct = i === q.answer;
    if (correct) score++;
    results.push(correct);

    var btns = choicesEl.querySelectorAll(".choice");
    btns.forEach(function (b, bi) {
      b.disabled = true;
      if (bi === q.answer) b.classList.add("correct");
      else if (bi === i) b.classList.add("incorrect");
    });

    explainEl.innerHTML = (correct ? "✅ Correct. " : "❌ Not quite. ") + q.explanation;
    explainEl.className = "explain show";
    scoreLabel.textContent = "Score: " + score + " / " + QUESTIONS.length;
    nextBtn.className = "next show";
    nextBtn.textContent = idx === QUESTIONS.length - 1 ? "See results →" : "Next →";
  }

  nextBtn.addEventListener("click", function () {
    idx++;
    if (idx >= QUESTIONS.length) {
      showFinal();
    } else {
      render();
    }
  });

  function showFinal() {
    fill.style.width = "100%";
    progLabel.textContent = QUESTIONS.length + " / " + QUESTIONS.length;
    quizBody.className = "quizBody hide";
    finalEl.className = "final show";
    finalScore.textContent = score + " / " + QUESTIONS.length;
    var pct = score / QUESTIONS.length;
    var line;
    if (pct === 1) line = "Perfect score! You've got a real handle on how this thing is built.";
    else if (pct >= 0.8) line = "Great run — you're reading the architecture like a regular.";
    else if (pct >= 0.5) line = "Solid effort — a few of these will click once you skim the files they point to.";
    else line = "Rough one today — no worries, these get revisited. Go peek at the files named above when you get a chance.";
    finalLine.textContent = line;
    finalBits.innerHTML = "";
    results.forEach(function (ok, i) {
      var d = document.createElement("div");
      d.className = "bit " + (ok ? "ok" : "no");
      d.textContent = (i + 1);
      finalBits.appendChild(d);
    });
  }

  render();
})();
</script>
</body>
</html>
