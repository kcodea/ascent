<script>
const QUESTIONS = [
  {
    topic: "types-basics",
    question: "packages/core/src/types.ts declares <code>export const ALE_IDS: readonly string[] = ['wo_mine', 'wo_reinforcement', ...];</code>. Compared to just writing <code>string[]</code>, what does adding <code>readonly</code> to the array's type actually change?",
    choices: [
      "It makes the array immutable at runtime — calling .push() on it throws an error",
      "It's purely a TypeScript compile-time check — the compiler flags code that tries to .push(), .pop(), or reassign an element as an error, but nothing stops it at runtime",
      "It tells the JavaScript engine to freeze the array automatically, the same as Object.freeze()",
      "It has no effect at all — TypeScript ignores readonly on array types"
    ],
    answer: 1,
    explanation: "TypeScript's types are erased at compile time — <code>readonly string[]</code> only changes what the TYPE CHECKER allows (it rejects <code>ALE_IDS.push(...)</code> or <code>ALE_IDS[0] = 'x'</code> as compile errors), but produces no runtime guard. The actual JS array underneath is still fully mutable unless something like <code>Object.freeze()</code> is ALSO called on it — that's a separate, runtime mechanism, which is what options A and C are actually describing. Option D is wrong too: readonly genuinely does change what compiles, which is exactly why it's useful documentation for \"this list isn't meant to be edited.\""
  },
  {
    topic: "immutability",
    question: "packages/core/src/combat/minion.ts's <code>instantiate()</code> turns a board card into a live combat Minion by building a brand-new object field-by-field — <code>{ uid: mkUid(), cardId: card.id, name: card.name, attack: board.attack, health: board.health, ... }</code> — reading values off the CardDef (<code>card</code>) and the board card (<code>board</code>). Its doc comment states: \"The CardDef is never mutated.\" Why does that matter?",
    choices: [
      "It's purely a style preference — mutating card directly would work exactly the same in practice",
      "card comes from the shared CARD_INDEX (one CardDef object per card id, reused across every board and every run); mutating it directly would corrupt that ONE shared object for every future use of that card, in every run, not just this combat",
      "JavaScript throws a runtime error if you try to reassign a property on an object pulled from a Record<string, CardDef>",
      "instantiate() needs a brand-new object because CardDef and Minion share no field names, so there's nothing to preserve either way"
    ],
    answer: 1,
    explanation: "CARD_INDEX is global — one CardDef object IS \"the Beetle card,\" referenced everywhere it's used. If instantiate() bumped <code>card.attack</code> in place instead of copying values onto a fresh Minion, that change would leak into every other board and run still holding a reference to that same shared object — a classic shared-mutable-state bug, not something confined to this one fight. Option C is false: JS doesn't runtime-block property reassignment like that, and CardDef's fields aren't typed readonly either. Option D is also false — CardDef and Minion actually share several field names (attack, health, keywords), which is exactly why it would be easy to mutate the wrong one by accident."
  },
  {
    topic: "reducer-run-state",
    question: "packages/sim/src/reducer.ts's exported <code>reduce(state, action)</code> calls <code>const next = reduceCore(state, action);</code> and then checks <code>if (next !== state && state.phase === 'recruit') { /* quest + FX bookkeeping */ }</code>. What is that <code>next !== state</code> check actually testing?",
    choices: [
      "Whether next and state contain the same VALUES — a deep-equality check",
      "Whether reduceCore returned a genuinely NEW state object, versus handing back the exact same state object unchanged — used here as a cheap way to detect \"did this action actually do anything?\"",
      "Whether the action was of a recognized type — an unrecognized action always fails this check",
      "A typo that should have been != (loose inequality) to also catch cases where the values merely differ"
    ],
    answer: 1,
    explanation: "<code>!==</code> on two objects in JS compares REFERENCE identity, not contents — two different objects with identical fields would still be <code>!==</code>. reduceCore hands back <code>state</code> itself, completely unchanged, when an action is rejected or is a no-op, and builds a fresh object for any action that actually changed something. So this check is a cheap identity comparison that skips the follow-up quest/FX bookkeeping entirely when nothing changed — far cheaper than deep-comparing every field. Option A describes a different, much more expensive check this code doesn't do; option D is wrong too — swapping to <code>!=</code> wouldn't change how JS compares two object references at all."
  },
  {
    topic: "zustand-store",
    question: "packages/ui/src/store.ts has <code>toggleCompact: () => set((s) => ({ compactCards: !s.compactCards })),</code> — passing set a FUNCTION of the previous state, rather than <code>set({ compactCards: someValue })</code>. Why use the function form here?",
    choices: [
      "Zustand requires the function form for every single set() call; the plain-object form doesn't actually exist",
      "The function form lets the update read the CURRENT state (s.compactCards) at the moment it actually runs and flip it, instead of relying on some value captured earlier — important because toggleCompact itself takes no arguments and has no other way to know the current value",
      "It's needed to make the state update happen asynchronously",
      "It merges every field in the entire store, whereas the plain-object form only updates compactCards"
    ],
    answer: 1,
    explanation: "toggleCompact takes zero parameters, so the only way to compute \"the opposite of whatever it currently is\" is to read the LIVE state at the moment the update runs — that's exactly what the callback form's <code>s</code> argument provides. Elsewhere in store.ts, calls like <code>set({ playerName })</code> use the plain-object form just fine when the caller already has the value in hand, which rules out option A. Option C is false — Zustand's set is synchronous either way. Option D has it backwards: Zustand's set shallow-merges the returned object into state regardless of which form produced it; the function form only changes HOW the new value gets computed, not what gets merged."
  },
  {
    topic: "event-bus",
    question: "packages/core/src/events.ts's own doc comment calls CombatBus \"a minimal synchronous event bus, scoped to a single combat.\" Sure enough, simulate() creates it with <code>const bus = new CombatBus();</code> INSIDE the function itself, not as a module-level constant shared across calls. Why does that matter?",
    choices: [
      "It's purely a performance optimization — one shared CombatBus would work identically, just slightly slower",
      "Each simulate() call gets its own private set of handlers with no leftover state — a shared/global bus would let handlers registered by one combat's minions stay attached (and firing) during the NEXT combat, breaking both determinism and the \"combat is a pure function\" guarantee",
      "CombatBus can only ever have one instance, since its handlers field is declared private readonly",
      "It has no real effect either way, since handlers gets cleared automatically after every emit() call"
    ],
    answer: 1,
    explanation: "simulate() is supposed to be a pure function of its inputs. A shared, module-level CombatBus would carry .on() registrations forward from one combat's minions into the NEXT call, which would make the outcome depend on combat HISTORY (what ran before, and in what order) rather than purely on this call's inputs — exactly the kind of hidden shared state the architecture forbids. A fresh <code>new CombatBus()</code> per call guarantees a clean slate every time. Option C misreads private readonly — that keyword restricts who can access the field from OUTSIDE the class; it says nothing about how many instances of the class may exist. Option D is false too: emit() never clears handlers — only a brand-new instance does."
  },
  {
    topic: "cards-in-sets",
    question: "packages/content/src/sets.ts's activeSet() is \"the first enabled entry [in the registry], or set1 if somebody disabled them all\" — and CLAUDE.md notes a run \"PINS its set at creation\" onto RunState.setId. If Kevin flips a brand-new set to enabled: true in the registry WHILE Mike is mid-run, what happens to Mike's in-progress run?",
    choices: [
      "Mike's run silently switches to drawing from the new set on his very next shop refresh",
      "Nothing — Mike's run already recorded its own setId the moment it was created, and keeps reading its pool through that pinned id (via poolOf(state)) no matter what the live registry says afterward",
      "Mike's run crashes, since activeSet() would now return a set his run was never validated against",
      "It depends on whether Mike's run is currently in the shop phase or in combat"
    ],
    answer: 1,
    explanation: "activeSet() only decides which set a BRAND-NEW run adopts; an existing run never calls it again — it already snapshotted its choice into RunState.setId at creation, and everything else reads the pool through poolOf(state) against that stored id, not by re-asking activeSet(). That's the whole point of pinning a set at creation \"like rifts\": flipping the live switch can never retroactively change an in-flight (or later replayed) run. Options A and D both imagine the run re-consulting the live registry mid-run, which it doesn't do; option C invents a failure mode that pinning specifically exists to avoid."
  },
  {
    topic: "package-boundaries",
    question: "The root package.json's typecheck script is <code>\"typecheck\": \"npm run typecheck:pkgs && npm run typecheck:web\"</code> — two SEPARATE tsc invocations, each pointed at its own tsconfig.json (one for core/content/sim/tools, a different one for ui/apps/web) — rather than one tsc pass over the whole repo. What does splitting it this way reflect about the codebase?",
    choices: [
      "It's purely to make the CI logs shorter and easier to read",
      "ui/apps/web need the DOM and JSX type libraries (to typecheck React components and browser APIs) that the engine packages don't need and shouldn't depend on — separate configs mirror the real dependency direction: core/content/sim/tools have zero need of anything UI-shaped, while ui depends on all of them",
      "TypeScript is physically unable to typecheck more than four packages in a single tsc invocation",
      "It's there only for historical reasons and could be merged into one command with no change in behavior"
    ],
    answer: 1,
    explanation: "The engine packages are meant to run headless — pure logic, no browser — while apps/web/ui are the only pieces that actually touch the DOM, React, and JSX. Giving them separate tsconfig.json files (and separate tsc runs) is a direct reflection of the sim-decoupled-from-UI architecture: mixing them into one config would mean the engine packages pick up DOM/JSX type libraries they have no business needing. Option D is wrong — merging the configs isn't behavior-neutral, since the two target genuinely different type libraries; option C is simply false; option A understates a real technical reason for a cosmetic one."
  },
  {
    topic: "effects-as-subscriptions",
    question: "packages/core/src/effects/factories.ts declares <code>export const FACTORIES: Partial&lt;Record&lt;EffectFactoryId, EffectFn&gt;&gt; = { deathrattleSummon: (ctx, self, params, payload) => {...}, ... };</code> — a plain object literal keyed by effect-id strings, each value a function. What pattern is this, and what does the Partial<...> wrapper signal?",
    choices: [
      "This is a big if/else chain in disguise; Partial just makes every property's syntax optional with no real meaning",
      "It's a dispatch table — a lookup map from an id to the function that handles it, so callers do FACTORIES[someId]?.(...) instead of writing a giant switch. Partial<Record<...>> means the type system does NOT require every EffectFactoryId to have an entry here — some ids are legitimately missing on purpose",
      "Partial means each factory function only receives some of its parameters at a time, filling in the rest later",
      "This is an inheritance hierarchy — each entry is a subclass of a base EffectFn class"
    ],
    answer: 1,
    explanation: "This is the classic \"map of id → handler function\" dispatch-table pattern, standing in for a long <code>switch (id) { case 'deathrattleSummon': ... }</code>. <code>Partial&lt;Record&lt;EffectFactoryId, EffectFn&gt;&gt;</code> is doing real, meaningful work in the type: a plain <code>Record&lt;EffectFactoryId, EffectFn&gt;</code> would force EVERY id in that huge union to have an entry (a compile error otherwise), while wrapping it in Partial says \"each key is optional\" — matching the file's own comment that recruit-time ids are implemented elsewhere and simply have no entry here. Options C and D invent behavior that neither TypeScript's Partial nor a plain object literal actually have."
  },
  {
    topic: "effect-timing-pipeline",
    question: "The doc comment above FACTORIES in packages/core/src/effects/factories.ts says: \"recruit-time ids (battlecries, buff-on-buy) are implemented in @game/sim against the run board, and any effect without a combat factory here is simply inert during simulate().\" Suppose, hypothetically due to a bug, a recruit-time-only id somehow got looked up mid-combat anyway. What would actually happen?",
    choices: [
      "simulate() would throw a runtime error, since every EffectFactoryId must resolve to a function somewhere",
      "FACTORIES[thatId] would be undefined (no entry exists for a recruit-time id here), so calling it during combat would simply do nothing — the effect is silently inert, not an error",
      "It would fall back to @game/sim's implementation automatically, since both packages read from the same EffectFactoryId union",
      "TypeScript would refuse to compile, since the union doesn't distinguish combat-time ids from recruit-time ones"
    ],
    answer: 1,
    explanation: "Because FACTORIES is a Partial record, a recruit-time-only id (say, a battlecry factory) simply has no entry in this combat-time table — looking it up returns undefined, and dispatch code written as <code>FACTORIES[id]?.(...)</code> just skips calling anything. There's no exception and no cross-package fallback: @game/core (where simulate() lives) has zero dependency on @game/sim, so it couldn't reach across to run the recruit-time implementation even if it wanted to. That's the real, load-bearing reason the recruit/combat split holds — it's enforced by WHICH package can even see which factories, not by the EffectFactoryId union itself, which stays one flat, undifferentiated list of strings."
  },
  {
    topic: "testing-vitest",
    question: "packages/core/src/combat/simulate.test.ts has: <code>const lantern = r.events.some((ev) => ev.type === 'sc' && /casts Lantern of Souls/.test(ev.text)); expect(lantern).toBe(true);</code> to check Anubis's Echo casts the right spell. Given that simulate() returns structured event OBJECTS with fields like type and source, why test by scanning for a regex match on ev.text — the human-readable narration string — at all?",
    choices: [
      "ev.text is the only field simulate() actually returns; structured fields like type don't exist",
      "Some facts about what happened (specifically WHICH spell got cast, by name) are represented in this event shape via the narration string, so the test uses .some() to search the whole array for ANY event matching both a structural check (ev.type === 'sc') and a text check, rather than assuming a fixed array index",
      "Regex matching is required because Vitest's expect() cannot compare object fields directly",
      "It's testing the UI's rendering output, not the simulation engine"
    ],
    answer: 1,
    explanation: "The test doesn't know, and shouldn't have to hardcode, exactly which index in the events array the Lantern cast lands at — so <code>.some()</code> searches the WHOLE array for an event satisfying both a structural filter (<code>type === 'sc'</code>) and a text check for the specific spell name, since which spell got cast is carried in the narration string for this event shape. That combination proves the RIGHT effect fired, not just that some Start-of-Combat event happened at all. Option A is false — the same line reads a structured <code>ev.type</code> field, proving structured fields exist; option C misunderstands expect(), which happily compares any value, structured or not; option D is wrong since simulate() is a pure core-engine function this test never touches the UI."
  }
];

let current = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById('quizArea');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const scoreCounter = document.getElementById('scoreCounter');

function render() {
  if (current >= QUESTIONS.length) {
    renderSummary();
    return;
  }
  const q = QUESTIONS[current];
  answered = false;
  progressFill.style.width = ((current) / QUESTIONS.length * 100) + '%';
  qCounter.textContent = `Question ${current + 1} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;

  const letters = ['A', 'B', 'C', 'D'];
  quizArea.innerHTML = `
    <div class="card">
      <span class="qtag">${q.topic}</span>
      <p class="qtext">${q.question}</p>
      <div class="choices" id="choicesWrap">
        ${q.choices.map((c, i) => `
          <button class="choice" data-idx="${i}">
            <span class="letter">${letters[i]}</span>
            <span>${c}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox"></div>
      <button class="nextbtn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'See results →' : 'Next question →'}</button>
    </div>
  `;

  const buttons = quizArea.querySelectorAll('.choice');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const correct = idx === q.answer;
      if (correct) score++;
      buttons.forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.getAttribute('data-idx'), 10);
        if (bi === q.answer) b.classList.add('correct');
        else if (bi === idx) b.classList.add('wrong');
      });
      const explainBox = document.getElementById('explainBox');
      explainBox.innerHTML = (correct ? '✅ <strong>Correct!</strong> ' : '❌ <strong>Not quite.</strong> ') + q.explanation;
      explainBox.classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
      scoreCounter.textContent = `Score: ${score}`;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    render();
  });
}

function renderSummary() {
  progressFill.style.width = '100%';
  qCounter.textContent = `Question ${QUESTIONS.length} / ${QUESTIONS.length}`;
  scoreCounter.textContent = `Score: ${score}`;
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let line;
  if (pct === 100) line = "Perfect score! You're reading this codebase like you wrote it.";
  else if (pct >= 80) line = "Great work — you're building real intuition for how this all fits together.";
  else if (pct >= 50) line = "Solid effort — a few concepts to revisit, and it'll click more each day.";
  else line = "Everyone starts somewhere — re-read the explanations above, tomorrow's quiz will circle back.";

  quizArea.innerHTML = `
    <div class="card summary">
      <div class="line">Quiz complete</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="line">${pct}%</div>
      <div class="encourage">${line}</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
