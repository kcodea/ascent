<title>Ascent Quiz #2 — 2026-08-14</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e2b;
    --panel-border: #2b2f42;
    --text: #e7e9f2;
    --muted: #9aa0b8;
    --accent: #7c9eff;
    --good: #4ade80;
    --bad: #f87171;
    --good-bg: rgba(74, 222, 128, 0.12);
    --bad-bg: rgba(248, 113, 113, 0.12);
    --choice-bg: #232739;
    --choice-hover: #2a2f45;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5fb;
      --panel: #ffffff;
      --panel-border: #dfe2f0;
      --text: #1b1e2b;
      --muted: #5c6180;
      --accent: #3f5fd8;
      --good: #15803d;
      --bad: #b91c1c;
      --good-bg: rgba(21, 128, 61, 0.1);
      --bad-bg: rgba(185, 28, 28, 0.1);
      --choice-bg: #f0f1f8;
      --choice-hover: #e6e8f5;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5fb;
    --panel: #ffffff;
    --panel-border: #dfe2f0;
    --text: #1b1e2b;
    --muted: #5c6180;
    --accent: #3f5fd8;
    --good: #15803d;
    --bad: #b91c1c;
    --good-bg: rgba(21, 128, 61, 0.1);
    --bad-bg: rgba(185, 28, 28, 0.1);
    --choice-bg: #f0f1f8;
    --choice-hover: #e6e8f5;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 32px 16px 64px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 640px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 600;
    font-size: 1.6rem;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }
  .progress {
    display: flex;
    gap: 6px;
    margin: 20px 0 28px;
  }
  .progress .dot {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--panel-border);
    transition: background 0.2s;
  }
  .progress .dot.done { background: var(--accent); }
  .progress .dot.current { background: var(--muted); }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .qnum { color: var(--accent); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 8px; }
  .question { font-size: 1.08rem; line-height: 1.5; margin: 0 0 20px; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--choice-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font-size: 0.97rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .choice:hover:not(:disabled) { background: var(--choice-hover); }
  .choice:active:not(:disabled) { transform: scale(0.99); }
  .choice:disabled { cursor: default; }
  .choice .label { font-weight: 700; margin-right: 8px; color: var(--muted); }
  .choice.correct { background: var(--good-bg); border-color: var(--good); }
  .choice.incorrect { background: var(--bad-bg); border-color: var(--bad); }
  .choice.reveal-correct { background: var(--good-bg); border-color: var(--good); }
  .result-tag { display: inline-block; font-weight: 700; font-size: 0.85rem; margin-top: 2px; }
  .result-tag.good { color: var(--good); }
  .result-tag.bad { color: var(--bad); }
  .explanation {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--text);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation code {
    background: var(--panel-border);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.85em;
  }
  .next-btn {
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: inline-block; }
  .hidden { display: none; }
  .summary { text-align: center; }
  .summary .score { font-size: 2.4rem; font-weight: 800; margin: 12px 0 4px; color: var(--accent); }
  .summary .line { color: var(--muted); font-size: 0.95rem; margin-bottom: 18px; }
  .summary .encourage { font-size: 1.05rem; margin: 20px 0; }
  .footer-note { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 20px; }
</style>

<div class="wrap">
  <header>
    <h1>🎓 Ascent Quiz #2</h1>
    <p>August 14, 2026 · How the game is coded, not how it plays</p>
  </header>
  <div class="progress" id="progress"></div>
  <div id="quiz-root"></div>
</div>

<script>
  const QUESTIONS = [
    {
      topic: "sim-ui-decoupling",
      question: "In Ascent, which part of the code actually decides who wins a combat — the React UI components, or the simulate() function in packages/core?",
      choices: [
        "The React UI components — they run the attack logic as the animations play",
        "The simulate() function in packages/core — it computes the whole outcome before any animation plays",
        "Both — the UI and the engine each calculate half of the result",
        "Neither — combat results are decided by a server"
      ],
      answer: 1,
      explanation: "CLAUDE.md's Architecture section is explicit: \"Combat is a pure function → event log → replay... The UI animates the event log on its own clock; it never computes outcomes.\" <code>simulate()</code> in <code>packages/core</code> runs first and produces a complete event log — the UI's only job afterward is to play that log back as animation. It's tempting to think the animations \"cause\" the result since that's what you watch happen, but the outcome already exists in the log before a single card moves on screen. (C and D invent a split/server setup that doesn't exist in this codebase.)"
    },
    {
      topic: "monorepo-packages",
      question: "Ascent's code is split into packages/core, packages/content, packages/sim, and packages/ui. Per CLAUDE.md's Monorepo section, which one has ZERO dependencies on the others — nothing else in the repo it imports from?",
      choices: [
        "packages/core — the pure engine (rng, types, event bus, effects, simulate())",
        "packages/ui — the React + Zustand presentation layer",
        "packages/sim — the run loop (economy, shop, tiers, triples, scoring)",
        "packages/content — the card/threat/quest data"
      ],
      answer: 0,
      explanation: "The Monorepo diagram in CLAUDE.md shows the dependency arrows: <code>core</code> has no arrow pointing at another local package — it's the foundation everything else is built on. <code>content</code> depends on <code>core</code>; <code>sim</code> depends on <code>core</code>+<code>content</code>; <code>ui</code> depends on all of them (\"→ all\"). Picking <code>ui</code> is the natural mixup: it's actually the MOST dependent package, the opposite of dependency-free."
    },
    {
      topic: "pure-functions",
      question: "simulate(playerSide, enemySide, rng, cards) is described as a \"pure function.\" Given the exact same playerSide, enemySide, rng, and cards every time, what does \"pure\" guarantee about what it returns?",
      choices: [
        "It will always return the exact same result — no hidden state, no side effects, nothing outside its inputs affects it",
        "It will run faster each time because it caches results in memory",
        "It will occasionally vary slightly because the RNG makes real games unpredictable",
        "It will read the current on-screen board to double-check its answer"
      ],
      answer: 0,
      explanation: "A pure function's output depends ONLY on its inputs, with nothing read from or written to the outside world — that's exactly why the same seeded <code>rng</code> + <code>cards</code> + boards always replays identically, which is how replays and shareable seeds work at all. Choice C is the trap: the RNG isn't truly random — it's a seeded generator threaded in as an ordinary input (see <code>packages/core/src/rng.ts</code>), so it's part of what makes the result reproducible, not what breaks it. B and D describe caching/DOM-reading side effects a pure function specifically must NOT have."
    },
    {
      topic: "data-vs-code",
      question: "Look at Training Dummy in packages/content/src/cards/set1/neutral.ts — it's a plain object literal: { id: 'trainingdummy', attack: 1, health: 1, keywords: ['T', 'DS'], effects: [] }. Per CLAUDE.md, why are almost all of Ascent's cards written this way instead of as one JS class per card?",
      choices: [
        "Because classes are illegal in TypeScript",
        "Cards are data + effect subscriptions on purpose — new cards should mean writing data, not new code, unless a genuinely new effect primitive is needed",
        "Object literals run faster than classes at runtime, which matters for the performance budget",
        "It's a historical leftover from an early prototype nobody has cleaned up"
      ],
      answer: 1,
      explanation: "CLAUDE.md states this directly: \"Cards are data + effect subscriptions, never bespoke classes. New cards = data only unless they need a genuinely new effect primitive.\" This keeps adding a card a content task — fill in a schema-validated object — instead of a programming task; keywords like Taunt/Ward on Training Dummy are declared data, not hand-coded per card. A is false (classes work fine in TS); C and D aren't the actual reason given — this is a deliberate architecture choice, not a perf trick or forgotten cleanup."
    },
    {
      topic: "event-log-replay",
      question: "simulate() builds up an events: CombatEvent[] array as combat resolves (packages/core/src/combat/simulate.ts), and the UI's buildBeats() (packages/ui/src/combatBeats.ts) turns that array into \"beats\" it paces on screen. Why does the engine emit a whole ARRAY of events instead of just returning who won?",
      choices: [
        "So the UI has a step-by-step record of everything that happened, which it can play back/animate at its own pace, independent of how the engine computed it",
        "Because arrays are required by TypeScript for any function that returns more than one value",
        "So the file size of the combat result stays small",
        "Purely for debugging — the array is stripped out before it ever reaches the UI in production"
      ],
      answer: 0,
      explanation: "The event log is the bridge between \"what happened\" (computed instantly and deterministically by <code>simulate()</code>) and \"what the player sees\" (animated over several seconds). <code>buildBeats()</code> groups raw events — attacks, buffs, deaths — into presentable beats the UI paces on its own clock, exactly matching CLAUDE.md: \"the UI animates the event log on its own clock; it never computes outcomes.\" B invents a fake TS rule; C and D contradict how the array is actually used — it isn't stripped, it IS the thing the UI renders."
    }
  ];

  const root = document.getElementById('quiz-root');
  const progressEl = document.getElementById('progress');
  let current = 0;
  let score = 0;
  const results = [];

  function renderProgress() {
    progressEl.innerHTML = '';
    for (let i = 0; i < QUESTIONS.length; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i < current ? ' done' : i === current ? ' current' : '');
      progressEl.appendChild(d);
    }
  }

  function renderQuestion(idx) {
    const q = QUESTIONS[idx];
    const card = document.createElement('div');
    card.className = 'card';

    const qnum = document.createElement('div');
    qnum.className = 'qnum';
    qnum.textContent = `Question ${idx + 1} of ${QUESTIONS.length}`;
    card.appendChild(qnum);

    const qtext = document.createElement('p');
    qtext.className = 'question';
    qtext.textContent = q.question;
    card.appendChild(qtext);

    const letters = ['A', 'B', 'C', 'D'];
    const buttons = [];
    let answered = false;

    q.choices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.innerHTML = `<span class="label">${letters[i]}</span>${choice}`;
      btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        const correct = i === q.answer;
        if (correct) score++;
        results.push(correct);
        buttons.forEach((b, bi) => {
          b.disabled = true;
          if (bi === q.answer) b.classList.add('reveal-correct');
          if (bi === i && !correct) b.classList.add('incorrect');
        });
        const tag = document.createElement('div');
        tag.className = 'result-tag ' + (correct ? 'good' : 'bad');
        tag.textContent = correct ? '✓ Correct!' : '✗ Not quite';
        card.appendChild(tag);

        const exp = document.createElement('div');
        exp.className = 'explanation show';
        exp.innerHTML = q.explanation;
        card.appendChild(exp);

        nextBtn.classList.add('show');
      });
      buttons.push(btn);
      card.appendChild(btn);
    });

    const nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = idx === QUESTIONS.length - 1 ? 'See results →' : 'Next question →';
    nextBtn.addEventListener('click', () => {
      current++;
      renderProgress();
      if (current >= QUESTIONS.length) {
        renderSummary();
      } else {
        root.innerHTML = '';
        renderQuestion(current);
      }
    });
    card.appendChild(nextBtn);

    root.appendChild(card);
  }

  function renderSummary() {
    root.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card summary';

    const label = document.createElement('div');
    label.className = 'qnum';
    label.textContent = 'Quiz complete';
    card.appendChild(label);

    const scoreEl = document.createElement('div');
    scoreEl.className = 'score';
    scoreEl.textContent = `${score} / ${QUESTIONS.length}`;
    card.appendChild(scoreEl);

    const line = document.createElement('div');
    line.className = 'line';
    line.textContent = `You scored ${score} out of ${QUESTIONS.length} on today's architecture quiz.`;
    card.appendChild(line);

    const messages = {
      5: "Perfect score! You're reading Ascent's engine like a pro. 🎉",
      4: "Great work — you've clearly got a solid handle on this.",
      3: "Solid effort — more than half down, and every miss is a lesson for tomorrow.",
      2: "Good start — this stuff gets clearer every day you sit with it.",
      1: "You're just getting going — reply with your score and we'll circle back to what tripped you up.",
      0: "No worries at all — everyone starts at zero. Tell me your score and we'll rebuild from here."
    };
    const encourage = document.createElement('div');
    encourage.className = 'encourage';
    encourage.textContent = messages[score] ?? messages[0];
    card.appendChild(encourage);

    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'Reply in chat with your score (e.g. "4/5, missed the pure-functions one") so tomorrow adapts.';
    card.appendChild(note);

    root.appendChild(card);
  }

  renderProgress();
  renderQuestion(current);
</script>
